      - name: Apply V0.10.0.2 vector sidebar and animated ability form
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $patchPath = Join-Path $PWD "build\v01002\v01002.patch"
          if (-not (Test-Path -LiteralPath $patchPath)) { throw "V0.10.0.2 patch missing: $patchPath" }
          Push-Location $env:SOURCE_ROOT
          try {
            & git apply --ignore-space-change --ignore-whitespace --whitespace=nowarn $patchPath
            if ($LASTEXITCODE -ne 0) { throw "V0.10.0.2 patch application failed: $LASTEXITCODE" }
          } finally {
            Pop-Location
          }
          # Use the canonical V0.10.0.2 application files after layered historical patches.
          Copy-Item -LiteralPath (Join-Path $PWD "build\v01002\main_v01002.py") -Destination (Join-Path $env:SOURCE_ROOT "app\src\main.py") -Force
          Copy-Item -LiteralPath (Join-Path $PWD "build\v01002\ability_sidebar_v01002.py") -Destination (Join-Path $env:SOURCE_ROOT "app\src\ability_sidebar.py") -Force
          $chunkDir = Join-Path $PWD "build\v01002\webp_b64"
          $chunks = @(Get-ChildItem -LiteralPath $chunkDir -Filter "chunk_*.txt" -File | Sort-Object Name)
          if ($chunks.Count -ne 29) { throw "V0.10.0.2 ability animation chunks incomplete: $($chunks.Count)/29" }
          $builder = New-Object System.Text.StringBuilder
          foreach ($chunk in $chunks) { [void]$builder.Append((Get-Content -LiteralPath $chunk.FullName -Raw).Trim()) }
          $abilityBytes = [Convert]::FromBase64String($builder.ToString())
          $abilityDst = Join-Path $env:SOURCE_ROOT "app\assets\xiaomeili_ability_form_v01002.webp"
          [System.IO.File]::WriteAllBytes($abilityDst, $abilityBytes)
          if ((Get-Item -LiteralPath $abilityDst).Length -lt 1000000) { throw "V0.10.0.2 ability animation reconstruction failed" }
          New-Item -ItemType Directory -Force -Path (Join-Path $env:SOURCE_ROOT "tests") | Out-Null
          Copy-Item -LiteralPath (Join-Path $PWD "build\v01002\test_v01002_contract.py") -Destination (Join-Path $env:SOURCE_ROOT "tests\test_v01002_contract.py") -Force
          Copy-Item -LiteralPath (Join-Path $PWD "build\v01002\V01002_CHANGELOG.txt") -Destination (Join-Path $env:SOURCE_ROOT "V01002_CHANGELOG.txt") -Force
          # Normalize the release identity explicitly after the layered historical patches.
          $mainPath = Join-Path $env:SOURCE_ROOT "app\src\main.py"
          $mainText = Get-Content -LiteralPath $mainPath -Raw
          $mainText = [regex]::Replace($mainText, 'APP_NAME\s*=\s*"[^"]*"', 'APP_NAME = "小美丽 V0.10.0.2｜Beauty Ability Sidebar"', 1)
          $mainText = [regex]::Replace($mainText, 'APP_VERSION\s*=\s*"[^"]*"', 'APP_VERSION = "0.10.0.2"', 1)
          $mainText = [regex]::Replace($mainText, 'APP_UPDATE_VERSION\s*=\s*"[^"]*"', 'APP_UPDATE_VERSION = "0.10.0.2"', 1)
          [System.IO.File]::WriteAllText($mainPath, $mainText, [System.Text.UTF8Encoding]::new($false))
          Set-Content -LiteralPath (Join-Path $env:SOURCE_ROOT "app\assets\VERSION.txt") -Value "0.10.0.2" -Encoding ascii
          Select-String -LiteralPath $mainPath -Pattern '^APP_(NAME|VERSION|UPDATE_VERSION)' | ForEach-Object { Write-Host $_.Line }
          python "$env:SOURCE_ROOT\tests\test_v01002_contract.py"
          if ($LASTEXITCODE -ne 0) { throw "V0.10.0.2 contract failed: $LASTEXITCODE" }
          python -m py_compile "$env:SOURCE_ROOT\app\src\main.py" "$env:SOURCE_ROOT\app\src\ability_sidebar.py"
          if ($LASTEXITCODE -ne 0) { throw "V0.10.0.2 syntax compile failed: $LASTEXITCODE" }
          $main = Get-Content -LiteralPath "$env:SOURCE_ROOT\app\src\main.py" -Raw
          $sidebar = Get-Content -LiteralPath "$env:SOURCE_ROOT\app\src\ability_sidebar.py" -Raw
          if ($main -notmatch 'APP_VERSION\s*=\s*"0\.10\.0\.2"') { throw "V0.10.0.2 version gate failed" }
          if ($sidebar -match 'ability_panel_reference_v0100\.png|_panel_pixmap') { throw "Screenshot-backed ability panel returned" }
          if ($sidebar -notmatch 'self\._sweep_timer\.setInterval\(33\)') { throw "Border sweep timer missing" }
          if ($sidebar -notmatch 'self\._sweep_timer\.stop\(\)') { throw "Border sweep stop-on-hide missing" }
          if ($sidebar -match 'unlink\(|rmtree\(|os\.remove\(|shutil\.move\(|Remove-Item') { throw "Ability sidebar contains a destructive file operation" }
          Write-Host "V0.10.0.2 vector sidebar + animated ability form PASS"

      - name: Apply V0.10.0.3 configurable ability polish
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Copy-Item -LiteralPath (Join-Path $PWD "build\v01003\main_v01003.py") -Destination (Join-Path $env:SOURCE_ROOT "app\src\main.py") -Force
          Copy-Item -LiteralPath (Join-Path $PWD "build\v01003\ability_sidebar_v01003.py") -Destination (Join-Path $env:SOURCE_ROOT "app\src\ability_sidebar.py") -Force
