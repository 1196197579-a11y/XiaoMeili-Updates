name: Inspect XiaoMeili source
on:
  push:
    paths:
      - "build/inspect/**"
jobs:
  inspect:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Expand seed and inspect drag interaction
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $seed = Join-Path $PWD "seed\XiaoMeili_V0_6_1_1_BootstrapFix_UpdateReady.zip"
          $stage = Join-Path $PWD "staging_inspect"
          if (Test-Path $stage) { Remove-Item $stage -Recurse -Force }
          New-Item -ItemType Directory -Path $stage | Out-Null
          Expand-Archive -LiteralPath $seed -DestinationPath $stage -Force
          $src = Join-Path $stage "XiaoMeili_V0_6_1_1_Source"
          python "build\v062\patch_v062.py" "$src" "$PWD"
          python "build\v0621\patch_v0621.py" "$src"
          python "build\v0622\patch_v0622.py" "$src"
          python "build\v070\patch_v070.py" "$src" "$PWD"
          python "build\v071\patch_v071.py" "$src" "$PWD"
          python "build\v072\patch_v072.py" "$src" "$PWD"
          python "build\v0731\patch_v0731.py" "$src" "$PWD"
          python "build\v0732\patch_v0732.py" "$src"
          python "build\v0733\patch_v0733.py" "$src"
          python "build\v074\patch_v074.py" "$src"
          python "build\v075\patch_v075.py" "$src"
          python "build\v076\patch_v076.py" "$src" "$PWD"
          python "build\v0761\patch_v0761.py" "$src" "$PWD"
          python "build\v0762\patch_v0762.py" "$src"
          python "build\v077\patch_v077.py" "$src" "$PWD"
          python "build\v0771\patch_v0771.py" "$src" "$PWD"
          python "build\v0772\patch_v0772.py" "$src"
          python "build\v0773\patch_v0773.py" "$src"
          python "build\v0774\patch_v0774.py" "$src"
          python "build\v0775\patch_v0775.py" "$src"
          python "build\v0776\patch_v0776.py" "$src"
          $main = Join-Path $src "app\src\main.py"
          $brain = Join-Path $src "app\src\brain_qwen.py"
          $ml = Get-Content -LiteralPath $main
          Write-Host "=== V0776 TARGET LINES ==="
          $patterns = @("lock_bubble","contextMenuEvent","_brain_edit_rule","brain_rules_list","avatar =","v774_profile_name","QFileDialog","lock_position","锁定","apply_clickthrough_native","apply_window_flags","mousePressEvent","mouseDoubleClickEvent","mouseMoveEvent","mouseReleaseEvent")
          foreach ($pattern in $patterns) {
            Write-Host ("--- PATTERN: " + $pattern + " ---")
            $matches = $ml | Select-String -SimpleMatch -Pattern $pattern
            foreach ($m in $matches) {
              $n = $m.LineNumber
              $a = [Math]::Max(1, $n-18)
              $b = [Math]::Min($ml.Count, $n+40)
              for ($i=$a; $i -le $b; $i++) { Write-Host ("L{0}: {1}" -f $i, $ml[$i-1]) }
            }
          }

          Write-Host "=== BRAIN_QWEN V0777 TARGETS ==="
          $bl = Get-Content -LiteralPath $brain
          $bpatterns = @("class BrainService","def ask","def generate","history","context_turns","persona","rules","prompt","messages","generation_finished","worker")
          foreach ($pattern in $bpatterns) {
            Write-Host ("--- BRAIN PATTERN: " + $pattern + " ---")
            $matches = $bl | Select-String -SimpleMatch -Pattern $pattern
            foreach ($m in $matches) {
              $n = $m.LineNumber
              $a = [Math]::Max(1, $n-30)
              $b = [Math]::Min($bl.Count, $n+90)
              for ($i=$a; $i -le $b; $i++) { Write-Host ("B{0}: {1}" -f $i, $bl[$i-1]) }
            }
          }
