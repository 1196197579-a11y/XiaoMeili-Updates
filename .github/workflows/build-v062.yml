          Copy-Item -LiteralPath (Join-Path $PWD "build\v0100_ref_final\xiaomeili_ability_form_v0100.png") -Destination (Join-Path $env:SOURCE_ROOT "app\assets\xiaomeili_ability_form_v0100.png") -Force
