name: Build and publish XiaoMeili v0.10.0.8

on:
  push:
    branches: [main]
    paths:
      - "build/release-trigger-v01008/**"

permissions:
  contents: write

concurrency:
  group: xiaomeili-v01008-safe-release
  cancel-in-progress: true

jobs:
  build-publish:
    runs-on: windows-latest
    timeout-minutes: 50
    steps:
      - name: Checkout update repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download verified V0.10.0.7 source baseline
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force -Path "$PWD\base-download" | Out-Null
          gh release download "v0.10.0.7" --repo "${{ github.repository }}" --pattern "XiaoMeili_V0.10.0.7_SourceProject.zip" --dir "$PWD\base-download"
          if ($LASTEXITCODE -ne 0) { throw "Cannot download V0.10.0.7 source baseline" }
          $zip = Join-Path $PWD "base-download\XiaoMeili_V0.10.0.7_SourceProject.zip"
          $stage = Join-Path $env:RUNNER_TEMP "xm-v01008-source"
          if (Test-Path $stage) { Remove-Item $stage -Recurse -Force }
          Expand-Archive -LiteralPath $zip -DestinationPath $stage -Force
          $main = Get-ChildItem -LiteralPath $stage -Recurse -File -Filter main.py | Where-Object { $_.FullName -match '[\\/]app[\\/]src[\\/]main\.py$' } | Select-Object -First 1
          if (-not $main) { throw "V0.10.0.7 source main.py not found" }
          $source = Split-Path -Parent (Split-Path -Parent (Split-Path -Parent $main.FullName))
          if (-not (Test-Path (Join-Path $source "app\src\native_updater.py"))) { throw "Native safe updater missing in baseline" }
          if (-not (Test-Path (Join-Path $source "app\assets\update_helper.ps1"))) { throw "Safe updater helper missing in baseline" }
          "SOURCE_ROOT=$source" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "SOURCE_ROOT=$source"

      - name: Apply V0.10.0.8 full diagnostic and voice interrupt patch
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python "build\v01008\patch_v01008.py" "$env:SOURCE_ROOT" "$PWD"
          if ($LASTEXITCODE -ne 0) { throw "V0.10.0.8 patch failed" }
          python -m py_compile "$env:SOURCE_ROOT\app\src\main.py" "$env:SOURCE_ROOT\app\src\speech_input.py" "$env:SOURCE_ROOT\app\src\brain_dual.py" "$env:SOURCE_ROOT\app\src\voice_dual.py" "$env:SOURCE_ROOT\app\src\resource_diagnostic_v01008.py"
          if ($LASTEXITCODE -ne 0) { throw "V0.10.0.8 Python compile check failed" }

      - name: V0.10.0.8 feature contract
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $main = Get-Content -LiteralPath "$env:SOURCE_ROOT\app\src\main.py" -Raw
          $speech = Get-Content -LiteralPath "$env:SOURCE_ROOT\app\src\speech_input.py" -Raw
          $brain = Get-Content -LiteralPath "$env:SOURCE_ROOT\app\src\brain_dual.py" -Raw
          $voice = Get-Content -LiteralPath "$env:SOURCE_ROOT\app\src\voice_dual.py" -Raw
          $diag = Get-Content -LiteralPath "$env:SOURCE_ROOT\app\src\resource_diagnostic_v01008.py" -Raw

          if ($main -notmatch 'APP_VERSION\s*=\s*"0\.10\.0\.8"') { throw "Version verification failed" }
          if ($main -notmatch 'resource_diagnostic_v01008') { throw "V0.10.0.8 diagnostic module not wired" }
          if ($main -notmatch 'interrupt_requested\.connect') { throw "Voice interrupt signal not wired" }
          if ($main -notmatch 'def _on_speech_interrupt') { throw "Voice interrupt handler missing" }
          if ($speech -notmatch 'def interrupt_only') { throw "Interrupt-only speech mode missing" }
          if ($speech -notmatch '闭嘴' -or $speech -notmatch '别说话' -or $speech -notmatch '安静') { throw "Interrupt hotwords missing" }
          if ($speech -notmatch 'SequenceMatcher') { throw "Fuzzy interrupt matching missing" }
          if ($brain -notmatch 'def abort_current') { throw "Cloud brain abort missing" }
          if ($voice -notmatch 'def abort_playback') { throw "TTS playback abort missing" }

          foreach ($required in @('summary.json','timeline_250ms.csv','process_gpu.csv','process_tree.csv','vision_timeline.csv','recognition_modules.csv','capture_topology.json','请上传给ChatGPT_全模块资源诊断摘要.txt')) {
            if ($diag -notmatch [regex]::Escape($required)) { throw "Diagnostic output missing: $required" }
          }
          if ($diag -notmatch '0\.25') { throw "250ms sampling contract missing" }
          if ($diag -notmatch 'nvidia-smi') { throw "Per-process GPU diagnostic path missing" }
          if ($diag -notmatch 'Fun-ASR' -or $diag -notmatch 'FSMN') { throw "Speech input diagnostic phase missing" }
          if ($diag -notmatch 'vision' -or $diag -notmatch 'recognition') { throw "Vision recognition diagnostic phase missing" }
          if ($diag -notmatch '不含 API Key' -or $diag -notmatch '不保存用户聊天' -or $diag -notmatch '麦克风录音') { throw "Diagnostic privacy/redaction contract missing" }
          Write-Host "V0.10.0.8 feature contract PASS"

      - name: FullSafe no-delete updater gate
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $main = Get-Content -LiteralPath "$env:SOURCE_ROOT\app\src\main.py" -Raw
          $native = Get-Content -LiteralPath "$env:SOURCE_ROOT\app\src\native_updater.py" -Raw
          $helper = Get-Content -LiteralPath "$env:SOURCE_ROOT\app\assets\update_helper.ps1" -Raw

          foreach ($bad in @('/MIR','/PURGE','robocopy.exe','Stop-Process')) {
            if ($helper -match [regex]::Escape($bad)) { throw "SAFETY BLOCK: updater helper contains $bad" }
          }
          if ($helper -match 'Remove-Item') { throw "SAFETY BLOCK: updater helper may delete files" }
          foreach ($bad in @('unlink\(','rmtree\(','remove\(','os\.remove','shutil\.rmtree')) {
            if ($native -match $bad) { throw "SAFETY BLOCK: native updater contains deletion primitive $bad" }
          }
          if ($native -notmatch 'NO_AUTOMATIC_FILE_DELETION') { throw "SAFETY BLOCK: no-delete marker policy missing" }
          if ($native -notmatch 'versions') { throw "SAFETY BLOCK: version-directory install missing" }
          if ($main -notmatch 'latest_safe\.json') { throw "SAFETY BLOCK: safe update channel missing" }
          if ($main -match 'target\s*=\s*Path\(sys\.executable\)\.parent') { throw "SAFETY BLOCK: unsafe install-root derivation" }
          Write-Host "V0.10.0.8 FullSafe no-delete updater gate PASS"

      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check --upgrade pip
          python -m pip install --disable-pip-version-check -r "$env:SOURCE_ROOT\app\requirements.txt"
          python -m pip install --disable-pip-version-check "pyinstaller>=6.10,<7" "dxcam>=0.0.5" "psutil>=6.0,<8"

      - name: Build Windows XiaoMeili.exe
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $dist = Join-Path $PWD "out"
          $pyi = @(
            "--noconfirm", "--clean", "--windowed",
            "--name", "XiaoMeili",
            "--icon", "$env:SOURCE_ROOT\app\assets\xiaomeili_icon.ico",
            "--distpath", $dist,
            "--workpath", "$PWD\pyi-work",
            "--specpath", "$PWD\pyi-spec",
            "--collect-all", "rapidocr",
            "--collect-all", "onnxruntime",
            "--collect-all", "soundfile",
            "--collect-all", "sounddevice",
            "--collect-all", "dxcam",
            "--collect-all", "dashscope",
            "--add-data", "$env:SOURCE_ROOT\app\assets;assets",
            "$env:SOURCE_ROOT\app\src\main.py"
          )
          python -m PyInstaller @pyi
          if ($LASTEXITCODE -ne 0) { throw "PyInstaller failed" }
          $exe = Join-Path $dist "XiaoMeili\XiaoMeili.exe"
          if (-not (Test-Path $exe)) { throw "XiaoMeili.exe missing" }
          & $exe --runtime-self-test
          if ($LASTEXITCODE -ne 0) { throw "Frozen runtime self-test failed" }
          & $exe --settings-ui-self-test
          if ($LASTEXITCODE -ne 0) { throw "Frozen settings UI self-test failed" }

      - name: Reuse verified stable safe launcher from V0.10.0.7
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          $d = Join-Path $env:RUNNER_TEMP "xm-old-update"
          New-Item -ItemType Directory -Force -Path $d | Out-Null
          gh release download "v0.10.0.7" --repo "${{ github.repository }}" --pattern "XiaoMeili_0.10.0.7_update.zip" --dir $d
          if ($LASTEXITCODE -ne 0) { throw "Cannot download stable launcher package" }
          $x = Join-Path $env:RUNNER_TEMP "xm-old-update-expanded"
          Expand-Archive -LiteralPath (Join-Path $d "XiaoMeili_0.10.0.7_update.zip") -DestinationPath $x -Force
          $launcher = Get-ChildItem -LiteralPath $x -Recurse -File -Filter XiaoMeiliLauncher.exe | Select-Object -First 1
          if (-not $launcher) { throw "Stable XiaoMeiliLauncher.exe missing" }
          Copy-Item -LiteralPath $launcher.FullName -Destination "$PWD\out\XiaoMeili\XiaoMeiliLauncher.exe" -Force

      - name: Create update ZIP and editable source bundle
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $release = Join-Path $PWD "release"
          New-Item -ItemType Directory -Force -Path $release | Out-Null
          $zip = Join-Path $release "XiaoMeili_0.10.0.8_update.zip"
          Compress-Archive -Path "$PWD\out\XiaoMeili\*" -DestinationPath $zip -CompressionLevel Optimal
          $hash = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          $size = (Get-Item -LiteralPath $zip).Length
          "UPDATE_ZIP=$zip" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "UPDATE_SHA256=$hash" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "UPDATE_SIZE=$size" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $sourceZip = Join-Path $release "XiaoMeili_V0.10.0.8_SourceProject.zip"
          Compress-Archive -Path "$env:SOURCE_ROOT\*" -DestinationPath $sourceZip -CompressionLevel Optimal
          "SOURCE_ZIP=$sourceZip" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "V0.10.0.8 SHA256=$hash size=$size"

      - name: Publish V0.10.0.8 release assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          gh release view "v0.10.0.8" --repo "${{ github.repository }}" *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload "v0.10.0.8" "$env:UPDATE_ZIP" "$env:SOURCE_ZIP" --clobber --repo "${{ github.repository }}"
            if ($LASTEXITCODE -ne 0) { throw "Release asset replacement failed" }
            gh release edit "v0.10.0.8" --repo "${{ github.repository }}" --title "XiaoMeili V0.10.0.8 | Full Resource Diagnostic + Voice Interrupt" --notes "Adds one-click full-module resource diagnostics with redacted ZIP export, per-process GPU/RAM/CPU sampling, speech-input and all current vision-recognition phases, plus fuzzy voice interruption such as 闭嘴/别说话 that immediately stops the current answer and returns to wake-word waiting. Keeps V0.10.0.7 cloned voice and cloud brain/TTS. FullSafe no-delete update."
          } else {
            gh release create "v0.10.0.8" "$env:UPDATE_ZIP" "$env:SOURCE_ZIP" --repo "${{ github.repository }}" --title "XiaoMeili V0.10.0.8 | Full Resource Diagnostic + Voice Interrupt" --notes "One-click full resource diagnostic + redacted ZIP, per-process GPU/RAM/CPU, speech-input and all current vision phases, fuzzy voice interrupt, unchanged cloned voice/cloud engines, FullSafe no-delete update."
          }
          if ($LASTEXITCODE -ne 0) { throw "V0.10.0.8 release publish failed" }

      - name: Verify public update asset before switching manifest
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $url = "https://github.com/${{ github.repository }}/releases/download/v0.10.0.8/XiaoMeili_0.10.0.8_update.zip"
          $verify = Join-Path $env:RUNNER_TEMP "XiaoMeili_0.10.0.8_verify.zip"
          Invoke-WebRequest -Uri $url -OutFile $verify -UseBasicParsing
          $remoteHash = (Get-FileHash -LiteralPath $verify -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($remoteHash -ne $env:UPDATE_SHA256) { throw "Public release hash mismatch" }
          $archive = [System.IO.Compression.ZipFile]::OpenRead($verify)
          try {
            if (-not ($archive.Entries | Where-Object { $_.FullName -ieq "XiaoMeili.exe" } | Select-Object -First 1)) { throw "XiaoMeili.exe missing in update ZIP" }
            if (-not ($archive.Entries | Where-Object { $_.FullName -ieq "XiaoMeiliLauncher.exe" } | Select-Object -First 1)) { throw "XiaoMeiliLauncher.exe missing in update ZIP" }
            $ver = $archive.Entries | Where-Object { $_.FullName -ieq "_internal/assets/VERSION.txt" -or $_.FullName -ieq "assets/VERSION.txt" } | Select-Object -First 1
            if (-not $ver) { throw "VERSION.txt missing in update ZIP" }
          } finally { $archive.Dispose() }
          Write-Host "Public V0.10.0.8 update asset verified"

      - name: Switch latest_safe.json to V0.10.0.8
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          $url = "https://github.com/${{ github.repository }}/releases/download/v0.10.0.8/XiaoMeili_0.10.0.8_update.zip"
          $manifest = [ordered]@{
            protocol = 1
            version = "0.10.0.8"
            package_url = $url
            sha256 = $env:UPDATE_SHA256
            package_size = [int64]$env:UPDATE_SIZE
            notes = @(
              'V0.10.0.8：一键深度资源诊断升级为全模块诊断，250ms采样并自动导出脱敏ZIP',
              '新增进程树、逐进程GPU显存/RAM/CPU、语音输入、云端大脑/TTS、白板与全部当前画面识别阶段',
              '记录当前实际屏幕采集拓扑与识别模块，先测量、不强行改识别架构',
              '新增“闭嘴/别说话/别说了/安静/停一下”等模糊打断：立即停语音、取消当前回答、关闭白板/指示灯并回到等待“美丽美丽”',
              '保持V0.10.0.7已确认的复刻音色、Qwen3-8B云端大脑与现有Fun-ASR配置',
              'FullSafe：只创建全新的versions版本目录并切换active.json；不删除、不移动、不镜像清理任何用户文件，旧版本保留回滚'
            )
          }
          git config user.name "XiaoMeili Update Bot"
          git config user.email "actions@users.noreply.github.com"
          git pull --rebase origin main
          $manifest | ConvertTo-Json -Depth 5 | Set-Content -LiteralPath "latest_safe.json" -Encoding utf8
          git add latest_safe.json
          git commit -m "Publish XiaoMeili v0.10.0.8 safe manifest"
          git push origin main
