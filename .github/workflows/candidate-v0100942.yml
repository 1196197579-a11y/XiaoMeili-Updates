name: Build XiaoMeili v0.10.0.9.4.2 unpublished candidate
on:
  push:
    branches: [codex/v0100942-e2e-20261005]
    paths: [build/v0100942/**, .github/workflows/candidate-v0100942.yml]
permissions:
  contents: read
jobs:
  candidate:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
      - name: Build candidate without release promotion
        shell: pwsh
        run: pwsh -NoProfile -File build/v0100942/build_candidate.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: XiaoMeili-v0100942-unpublished
          path: candidate-artifacts942/*
          retention-days: 7
