name: Build and publish XiaoMeili v0.7.7.10

on:
  push:
    branches: [main]
    paths:
      - "build/release-trigger/**"

permissions:
  contents: write

jobs:
  build-publish:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout update repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Expand one-time bootstrap seed
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $seed = Join-Path $PWD "seed\XiaoMeili_V0_6_1_1_BootstrapFix_UpdateReady.zip"
          if (-not (Test-Path $seed)) { throw "Bootstrap seed ZIP not found: $seed" }
          $stage = Join-Path $PWD "staging"
          if (Test-Path $stage) { Remove-Item $stage -Recurse -Force }
          New-Item -ItemType Directory -Path $stage | Out-Null
          Expand-Archive -LiteralPath $seed -DestinationPath $stage -Force
          $source = Join-Path $stage "XiaoMeili_V0_6_1_1_Source"
          if (-not (Test-Path (Join-Path $source "app\src\main.py"))) {
            throw "Unexpected seed layout: $source"
          }
          "SOURCE_ROOT=$source" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Patch stable source to v0.7.7.10
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          function Run-PythonChecked {
            param([Parameter(ValueFromRemainingArguments=$true)][string[]]$Args)
            & python @Args
            if ($LASTEXITCODE -ne 0) { throw "Python command failed: python $($Args -join ' ')" }
          }
          Run-PythonChecked "build\v062\patch_v062.py" "$env:SOURCE_ROOT" "$PWD"
          Run-PythonChecked "build\v0621\patch_v0621.py" "$env:SOURCE_ROOT"
          Run-PythonChecked "build\v0622\patch_v0622.py" "$env:SOURCE_ROOT"
          Run-PythonChecked "build\v070\patch_v070.py" "$env:SOURCE_ROOT" "$PWD"
          Run-PythonChecked "build\v071\patch_v071.py" "$env:SOURCE_ROOT" "$PWD"
          Run-PythonChecked "build\v072\patch_v072.py" "$env:SOURCE_ROOT" "$PWD"
          Run-PythonChecked "build\v0731\patch_v0731.py" "$env:SOURCE_ROOT" "$PWD"
          Run-PythonChecked "build\v0732\patch_v0732.py" "$env:SOURCE_ROOT"
          Run-PythonChecked "build\v0733\patch_v0733.py" "$env:SOURCE_ROOT"
          Run-PythonChecked "build\v074\patch_v074.py" "$env:SOURCE_ROOT"
          Run-PythonChecked "build\v075\patch_v075.py" "$env:SOURCE_ROOT"
          Run-PythonChecked "build\v076\patch_v076.py" "$env:SOURCE_ROOT" "$PWD"
          Run-PythonChecked "build\v0761\patch_v0761.py" "$env:SOURCE_ROOT" "$PWD"
          Run-PythonChecked "build\v0762\patch_v0762.py" "$env:SOURCE_ROOT"
          Run-PythonChecked "build\v077\patch_v077.py" "$env:SOURCE_ROOT" "$PWD"
          Run-PythonChecked "build\v0771\patch_v0771.py" "$env:SOURCE_ROOT" "$PWD"
          Run-PythonChecked "build\v0772\patch_v0772.py" "$env:SOURCE_ROOT"
          Run-PythonChecked "build\v0773\patch_v0773.py" "$env:SOURCE_ROOT"
          Run-PythonChecked "build\v0774\patch_v0774.py" "$env:SOURCE_ROOT"
          Run-PythonChecked "build\v0775\patch_v0775.py" "$env:SOURCE_ROOT"
          Run-PythonChecked "build\v0776\patch_v0776.py" "$env:SOURCE_ROOT"
          Run-PythonChecked "build\v0777\patch_v0777.py" "$env:SOURCE_ROOT"
          Run-PythonChecked "build\v0778\patch_v0778.py" "$env:SOURCE_ROOT"
          Run-PythonChecked "build\v0779\patch_v0779.py" "$env:SOURCE_ROOT"
          Run-PythonChecked "build\v07710\patch_v07710.py" "$env:SOURCE_ROOT"
          Run-PythonChecked "-m" "py_compile" "$env:SOURCE_ROOT\app\src\main.py" "$env:SOURCE_ROOT\app\src\voice_qwen.py" "$env:SOURCE_ROOT\app\src\brain_qwen.py" "$env:SOURCE_ROOT\app\src\ndm_bridge.py"
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$env:SOURCE_ROOT\app\assets\storage_migrate.ps1", [ref]$tokens, [ref]$parseErrors) | Out-Null
          if ($parseErrors.Count -gt 0) { throw "PowerShell helper parse failed: $($parseErrors | Out-String)" }
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$env:SOURCE_ROOT\app\assets\update_helper.ps1", [ref]$tokens, [ref]$parseErrors) | Out-Null
          if ($parseErrors.Count -gt 0) { throw "Update helper parse failed: $($parseErrors | Out-String)" }
          $testSrc = "C:\Users\Public\XiaoMeiliData_CI_0761"
          $testDst = "D:\XiaoMeiliData_CI_0761"
          $testLog = "D:\xiaomeili_migration_ci_0761.log"
          $testReady = "D:\xiaomeili_migration_ci_0761.ready"
          Remove-Item -LiteralPath $testSrc -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item -LiteralPath $testDst -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item -LiteralPath $testLog -Force -ErrorAction SilentlyContinue
          Remove-Item -LiteralPath $testReady -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path (Join-Path $testSrc "brain\models") | Out-Null
          New-Item -ItemType Directory -Force -Path (Join-Path $testSrc "voice\runtime") | Out-Null
          New-Item -ItemType Directory -Force -Path (Join-Path $testSrc "assets") | Out-Null
          '{"ok":true}' | Set-Content -LiteralPath (Join-Path $testSrc "config.json") -Encoding UTF8
          'modeldata' | Set-Content -LiteralPath (Join-Path $testSrc "brain\models\test.gguf") -Encoding UTF8
          'voicedata' | Set-Content -LiteralPath (Join-Path $testSrc "voice\runtime\test.bin") -Encoding UTF8
          'assetdata' | Set-Content -LiteralPath (Join-Path $testSrc "assets\idle.txt") -Encoding UTF8
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File "$env:SOURCE_ROOT\app\assets\storage_migrate.ps1" -Source $testSrc -Target $testDst -ParentPid 999999 -ExePath "C:\Windows\System32\whoami.exe" -DesktopLog $testLog -ReadyFile $testReady
          if ($LASTEXITCODE -ne 0) {
            if (Test-Path -LiteralPath $testLog) { Get-Content -LiteralPath $testLog | Write-Host }
            throw "Windows PowerShell 5.1 migration smoke test failed: exit=$LASTEXITCODE"
          }
          if (-not (Test-Path -LiteralPath $testReady)) { throw "migration READY handshake missing" }
          $testItem = Get-Item -LiteralPath $testSrc -Force
          if (($testItem.Attributes -band [System.IO.FileAttributes]::ReparsePoint) -eq 0) { throw "migration source is not a junction" }
          if (-not (Test-Path -LiteralPath (Join-Path $testSrc "brain\models\test.gguf"))) { throw "old compatibility path cannot read migrated file" }
          if (-not (Test-Path -LiteralPath (Join-Path $testDst "brain\models\test.gguf"))) { throw "D target missing migrated file" }
          Write-Host "V0761 migration helper Windows PowerShell 5.1 smoke test PASS"
          $main = Get-Content -LiteralPath "$env:SOURCE_ROOT\app\src\main.py" -Raw
          if ($main -notmatch 'APP_VERSION\s*=\s*"0\.7\.7\.10"') { throw "Source version verification failed: expected 0.7.7.10" }
          Set-Content -LiteralPath "$env:SOURCE_ROOT\app\assets\VERSION.txt" -Value "0.7.7.10" -Encoding ascii

      - name: Install desktop build dependencies
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check --upgrade pip
          python -m pip install --disable-pip-version-check -r "$env:SOURCE_ROOT\app\requirements.txt"
          python -m pip install --disable-pip-version-check "pyinstaller>=6.10,<7" "dxcam>=0.0.5"

      - name: Build Windows EXE
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $dist = Join-Path $PWD "out"
          $work = Join-Path $PWD "pyi-work"
          $spec = Join-Path $PWD "pyi-spec"
          $pyi = @(
            "--noconfirm", "--clean", "--windowed",
            "--name", "XiaoMeili",
            "--icon", "$env:SOURCE_ROOT\app\assets\xiaomeili_icon.ico",
            "--distpath", "$dist",
            "--workpath", "$work",
            "--specpath", "$spec",
            "--collect-all", "rapidocr",
            "--collect-all", "onnxruntime",
            "--collect-all", "soundfile",
            "--collect-all", "sounddevice",
            "--collect-all", "dxcam",
            "--add-data", "$env:SOURCE_ROOT\app\assets;assets",
            "$env:SOURCE_ROOT\app\src\main.py"
          )
          python -m PyInstaller @pyi
          if ($LASTEXITCODE -ne 0) { throw "PyInstaller failed: $LASTEXITCODE" }
          $exe = Join-Path $dist "XiaoMeili\XiaoMeili.exe"
          if (-not (Test-Path $exe)) { throw "PyInstaller did not produce XiaoMeili.exe" }
          & $exe --runtime-self-test
          if ($LASTEXITCODE -ne 0) { throw "Frozen runtime self-test failed: $LASTEXITCODE" }
          & $exe --settings-ui-self-test
          if ($LASTEXITCODE -ne 0) { throw "Frozen settings UI self-test failed: $LASTEXITCODE" }

      - name: Create update package and SHA-256
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $releaseDir = Join-Path $PWD "release"
          New-Item -ItemType Directory -Path $releaseDir -Force | Out-Null
          $zip = Join-Path $releaseDir "XiaoMeili_0.7.7.10_update.zip"
          if (Test-Path $zip) { Remove-Item $zip -Force }
          Compress-Archive -Path "$PWD\out\XiaoMeili\*" -DestinationPath $zip -CompressionLevel Optimal
          $hash = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ([string]::IsNullOrWhiteSpace($hash)) { throw "SHA-256 calculation failed" }
          "UPDATE_ZIP=$zip" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "UPDATE_SHA256=$hash" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Built SHA256=$hash"

      - name: Publish v0.7.7.10 release asset
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          gh release view "v0.7.7.10" --repo "${{ github.repository }}" *> $null
          if ($LASTEXITCODE -eq 0) {
            throw "Release v0.7.7.10 already exists. Refusing to overwrite an existing release asset; bump the version instead."
          }
          $ghargs = @(
            "release", "create", "v0.7.7.10", "$env:UPDATE_ZIP",
            "--repo", "${{ github.repository }}",
            "--title", "XiaoMeili V0.7.7.10",
            "--notes", "V0.7.7.10 adds a new XiaoMeili VoiceDesign preset tuned for a cool, aloof, slightly cocky young-girl delivery with subtle human-like clause pauses, fixes the voice selector event that was discarded while Settings was hidden, improves installed voice-pack status text, and changes locked right-click behavior to show an explicit Unlock menu instead of auto-unlocking and then reopening the Lock menu."
          )
          & gh @ghargs
          if ($LASTEXITCODE -ne 0) { throw "GitHub release publish failed: $LASTEXITCODE" }

      - name: Verify the public release download before manifest switch
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $url = "https://github.com/${{ github.repository }}/releases/download/v0.7.7.10/XiaoMeili_0.7.7.10_update.zip"
          $verify = Join-Path $env:RUNNER_TEMP "XiaoMeili_0.7.7.10_verify.zip"
          Invoke-WebRequest -Uri $url -OutFile $verify -UseBasicParsing
          $remoteHash = (Get-FileHash -LiteralPath $verify -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($remoteHash -ne $env:UPDATE_SHA256) {
            throw "Release verification failed. local=$env:UPDATE_SHA256 remote=$remoteHash"
          }
          $archive = [System.IO.Compression.ZipFile]::OpenRead($verify)
          try {
            $exeEntry = $archive.Entries | Where-Object { $_.FullName -ieq "XiaoMeili.exe" } | Select-Object -First 1
            if (-not $exeEntry) { throw "Verified update ZIP does not contain XiaoMeili.exe at package root" }
            $verEntry = $archive.Entries | Where-Object { $_.FullName -ieq "_internal/assets/VERSION.txt" -or $_.FullName -ieq "assets/VERSION.txt" } | Select-Object -First 1
            if (-not $verEntry) { throw "Verified update ZIP does not contain VERSION.txt" }
          } finally {
            $archive.Dispose()
          }
          Write-Host "Public release verified: $url"

      - name: Switch latest.json only after release verification
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          $url = "https://github.com/${{ github.repository }}/releases/download/v0.7.7.10/XiaoMeili_0.7.7.10_update.zip"
          $manifest = [ordered]@{
            protocol = 1
            version = "0.7.7.10"
            package_url = $url
            sha256 = $env:UPDATE_SHA256
            notes = @(
              "新增「小美丽｜高冷酷拽（推荐）」VoiceDesign 声线：年轻女孩感、清澈偏冷、高冷酷拽、略带漫不经心和轻微嫌弃，明确禁止甜、奶、撒娇、夹子音和成熟御姐感",
              "新声线加入轻量真人停顿：不会乱加「嗯啊那个」等口头禅，只在中文转折和短语边界补充轻微节奏停顿，自动朗读和试听都会生效",
              "推荐语速设定为约 0.95×；实际仍保留原语速控件，可按听感继续微调",
              "修复中文女声下拉框长期灰色、无法重新选声线的问题：旧代码在设置窗口尚未显示时收到声线列表事件会直接丢弃，导致列表永远不填充",
              "声线列表现在无论设置窗口是否可见都会同步；已有固定声音不会阻止你重新海选或更换其他女声",
              "小女孩 VoiceDesign 扩展已安装时，按钮会明确显示「✓ 小女孩声线扩展已安装」，不再用灰色的「安装」按钮造成误解",
              "当前固定声音改为显示友好名称，不再直接暴露 design_bean 等内部 ID",
              "修复右键锁定/解锁逻辑：锁定状态不再在右键释放时自动解锁，而是弹出独立的「解锁小美丽（游戏防误触）」菜单，选择后才解除锁定",
              "未锁定状态右键仍显示「锁定小美丽（游戏防误触）」；锁定状态和未锁定状态的菜单文字与行为现在严格对应",
              "发布自检新增隐藏设置窗口下的声线列表填充测试、高冷推荐声线存在测试、自然停顿文本测试和锁定菜单静态检查"
            )
          }
          $manifest | ConvertTo-Json -Depth 5 | Set-Content -Path "latest.json" -Encoding utf8
          git config user.name "XiaoMeili Update Bot"
          git config user.email "actions@users.noreply.github.com"
          git add latest.json
          git commit -m "Publish XiaoMeili v0.7.7.10 manifest"
          git push
