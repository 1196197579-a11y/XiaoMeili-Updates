          python -m PyInstaller --noconfirm --clean --onefile --windowed --name XiaoMeiliLauncher --icon "$env:SOURCE_ROOT\app\assets\xiaomeili_icon.ico" --distpath $launcherOut --workpath "$PWD\launcher-work" --specpath "$PWD\launcher-spec" "build\v092\launcher.py"
          if ($LASTEXITCODE -ne 0) { throw "Launcher PyInstaller failed: $LASTEXITCODE" }
          $launcher = Join-Path $launcherOut "XiaoMeiliLauncher.exe"
          if (-not (Test-Path $launcher)) { throw "Safe launcher missing after build." }
          "LAUNCHER_EXE=$launcher" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Create update package and SHA-256
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Copy-Item -LiteralPath $env:LAUNCHER_EXE -Destination "$PWD\out\XiaoMeili\XiaoMeiliLauncher.exe" -Force
          $releaseDir = Join-Path $PWD "release"
          New-Item -ItemType Directory -Path $releaseDir -Force | Out-Null
          $zip = Join-Path $releaseDir "XiaoMeili_0.10.0.3_update.zip"
          if (Test-Path $zip) { Remove-Item $zip -Force }
          Compress-Archive -Path "$PWD\out\XiaoMeili\*" -DestinationPath $zip -CompressionLevel Optimal
          $hash = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ([string]::IsNullOrWhiteSpace($hash)) { throw "SHA-256 calculation failed" }
          "UPDATE_ZIP=$zip" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "UPDATE_SHA256=$hash" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $size = (Get-Item -LiteralPath $zip).Length
          "UPDATE_SIZE=$size" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Built SHA256=$hash"

      - name: Publish V0.10.0.3 safe assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          gh release view "v0.10.0.3" --repo "${{ github.repository }}" *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload "v0.10.0.3" "$env:UPDATE_ZIP" "$env:SOURCE_BUNDLE" --clobber --repo "${{ github.repository }}"
            if ($LASTEXITCODE -ne 0) { throw "Release asset replacement failed: $LASTEXITCODE" }
            gh release edit "v0.10.0.3" --repo "${{ github.repository }}" --title "XiaoMeili V0.10.0.3 | Configurable Ability Sidebar" --notes "V0.10.0.3 adds user-tunable ability layout, four-character custom names, editable cached TTS phrases, private Maoken font loading, removes the character aura, strengthens reference-style glow, and upgrades border sweep to 60fps while FullSafe remains no-delete."
            if ($LASTEXITCODE -ne 0) { throw "Release metadata update failed: $LASTEXITCODE" }
          } else {
            $ghargs = @(
              "release", "create", "v0.10.0.3", "$env:UPDATE_ZIP", "$env:SOURCE_BUNDLE",
              "--repo", "${{ github.repository }}",
              "--title", "XiaoMeili V0.10.0.3 | Configurable Ability Sidebar",
              "--notes", "V0.10.0.3 true vector glass sidebar + dual cyan sweep lights + uploaded animated ability form + FullSafe no-delete update path."
            )
            & gh @ghargs
            if ($LASTEXITCODE -ne 0) { throw "GitHub release publish failed: $LASTEXITCODE" }
          }

      - name: Verify the public release download before manifest switch
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $url = "https://github.com/${{ github.repository }}/releases/download/v0.10.0.3/XiaoMeili_0.10.0.3_update.zip"
          $verify = Join-Path $env:RUNNER_TEMP "XiaoMeili_0.10.0.3_verify.zip"
          Invoke-WebRequest -Uri $url -OutFile $verify -UseBasicParsing
          $remoteHash = (Get-FileHash -LiteralPath $verify -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($remoteHash -ne $env:UPDATE_SHA256) {
            throw "Release verification failed. local=$env:UPDATE_SHA256 remote=$remoteHash"
          }
          $archive = [System.IO.Compression.ZipFile]::OpenRead($verify)
          try {
            $exeEntry = $archive.Entries | Where-Object { $_.FullName -ieq "XiaoMeili.exe" } | Select-Object -First 1
            if (-not $exeEntry) { throw "Verified update ZIP does not contain XiaoMeili.exe at package root" }
            $launcherEntry = $archive.Entries | Where-Object { $_.FullName -ieq "XiaoMeiliLauncher.exe" } | Select-Object -First 1
            if (-not $launcherEntry) { throw "Verified update ZIP does not contain XiaoMeiliLauncher.exe at package root" }
            $verEntry = $archive.Entries | Where-Object { $_.FullName -ieq "_internal/assets/VERSION.txt" -or $_.FullName -ieq "assets/VERSION.txt" } | Select-Object -First 1
            if (-not $verEntry) { throw "Verified update ZIP does not contain VERSION.txt" }
          } finally {
            $archive.Dispose()
          }
          Write-Host "Public release verified: $url"
          $sourceUrl = "https://github.com/${{ github.repository }}/releases/download/v0.10.0.3/XiaoMeili_V0.10.0.3_SourceProject.zip"
          $sourceVerify = Join-Path $env:RUNNER_TEMP "XiaoMeili_V0.10.0.3_SourceProject_verify.zip"
          Invoke-WebRequest -Uri $sourceUrl -OutFile $sourceVerify -UseBasicParsing
          $sourceRemoteHash = (Get-FileHash -LiteralPath $sourceVerify -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($sourceRemoteHash -ne $env:SOURCE_SHA256) { throw "Source-project release verification failed. local=$env:SOURCE_SHA256 remote=$sourceRemoteHash" }
          Write-Host "Public complete source project verified: $sourceUrl"

      - name: Verify legacy update channel remains disabled
        shell: pwsh
        run: |
          $legacy = Get-Content -LiteralPath "latest.json" -Raw | ConvertFrom-Json
          if ([string]$legacy.version -ne "0.0.0" -or -not [string]::IsNullOrWhiteSpace([string]$legacy.package_url)) {
            throw "Legacy latest.json must remain disabled so old destructive updaters cannot receive releases."
          }

      - name: Switch latest_safe.json only after release verification
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          $url = "https://github.com/${{ github.repository }}/releases/download/v0.10.0.3/XiaoMeili_0.10.0.3_update.zip"
          $manifest = [ordered]@{
            protocol = 1
            version = "0.10.0.3"
            package_url = $url
            sha256 = $env:UPDATE_SHA256
            package_size = [int64]$env:UPDATE_SIZE
            notes = @(
              'V0.10.0.3：美丽能力名称支持自定义，固定最多四个字；五个显示名称与内部能力ID完全分离，改名不会影响功能',
              '新增布局实时调整：侧栏大小、小美丽大小、两者距离、侧栏上下、小美丽左右/上下位置均可自己微调，并可恢复参考图默认布局',
              '彻底移除能力按钮触发的人物椭圆/扫描光框；小美丽只保留视频素材自身的淡白描边与柔光',
              '猫啃什锦黑-轻量版改为私有字体加载：自动识别 MaokenAssortedSans-Lite*.otf 并仅复制到 XiaoMeiliData/fonts，不安装系统字体、不删除源文件',
              '五个能力开启语音均可自定义，默认已填入可用台词；保存后预缓存，点击开关时与170ms滑动动画同步走小美丽当前固定声音',
              '侧栏进一步按参考图精修：修正按钮右侧留白，增强三层外框辉光、ON开关光晕、引导线与连接圆点质感；双光点扫边提升至约60fps，仅展开时运行',
              '继续遵守 FullSafe：更新只创建新的受控版本目录并切换 active.json，不递归清理 Downloads，不移动、不覆盖、不删除用户文件'
            )
          }
          $manifest | ConvertTo-Json -Depth 5 | Set-Content -Path "latest_safe.json" -Encoding utf8
          git config user.name "XiaoMeili Update Bot"
          git config user.email "actions@users.noreply.github.com"
          git add latest_safe.json
          git commit -m "Publish XiaoMeili v0.10.0.3 safe manifest"
          git pull --rebase origin main
          git push
