name: Publish XiaoMeili v0.10.0.9.2 legacy bootstrap package

on:
  push:
    branches: [main]
    paths:
      - "build/release-trigger-v010092-bootstrap/**"

permissions:
  contents: write

concurrency:
  group: xiaomeili-v010092-legacy-bootstrap
  cancel-in-progress: true

jobs:
  bootstrap:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Download verified V0.10.0.9.2 package
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference="Stop"
          New-Item -ItemType Directory -Force -Path "$PWD\base" | Out-Null
          gh release download "v0.10.0.9.2" --repo "${{ github.repository }}" --pattern "XiaoMeili_0.10.0.9.2_update.zip" --dir "$PWD\base"
          if ($LASTEXITCODE -ne 0) { throw "Cannot download V0.10.0.9.2 package" }

      - name: Create legacy four-part-comparator bootstrap package
        shell: pwsh
        run: |
          $ErrorActionPreference="Stop"
          $src="$PWD\base\XiaoMeili_0.10.0.9.2_update.zip"
          $stage=Join-Path $env:RUNNER_TEMP "xm-v010092-bootstrap"
          Expand-Archive -LiteralPath $src -DestinationPath $stage -Force
          $exe=Join-Path $stage "XiaoMeili.exe"
          if (-not (Test-Path $exe)) { throw "XiaoMeili.exe missing" }
          $versionCandidates=@(
            (Join-Path $stage "_internal\assets\VERSION.txt"),
            (Join-Path $stage "assets\VERSION.txt")
          )
          $versionFile=$null
          foreach($p in $versionCandidates) {
            if (Test-Path $p) { $versionFile=$p; break }
          }
          if (-not $versionFile) { throw "VERSION.txt missing" }
          Set-Content -LiteralPath $versionFile -Value "0.10.0.10" -Encoding ascii -NoNewline

          New-Item -ItemType Directory -Force -Path "$PWD\release" | Out-Null
          $zip="$PWD\release\XiaoMeili_0.10.0.10_bootstrap_to_0.10.0.9.2.zip"
          Compress-Archive -Path "$stage\*" -DestinationPath $zip -CompressionLevel Optimal
          $hash=(Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          $size=(Get-Item $zip).Length
          "BOOT_ZIP=$zip" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "BOOT_SHA256=$hash" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "BOOT_SIZE=$size" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Verify bootstrap package contract
        shell: pwsh
        run: |
          $ErrorActionPreference="Stop"
          $verify=Join-Path $env:RUNNER_TEMP "verify-bootstrap"
          Expand-Archive -LiteralPath "$env:BOOT_ZIP" -DestinationPath $verify -Force
          if (-not (Test-Path (Join-Path $verify "XiaoMeili.exe"))) { throw "bootstrap exe missing" }
          $vf=$null
          foreach($p in @((Join-Path $verify "_internal\assets\VERSION.txt"),(Join-Path $verify "assets\VERSION.txt"))) {
            if (Test-Path $p) { $vf=$p; break }
          }
          if (-not $vf) { throw "bootstrap VERSION missing" }
          $v=(Get-Content $vf -Raw).Trim()
          if ($v -ne "0.10.0.10") { throw "bootstrap VERSION mismatch: $v" }

      - name: Upload bootstrap package to V0.10.0.9.2 release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference="Stop"
          gh release upload "v0.10.0.9.2" "$env:BOOT_ZIP" --repo "${{ github.repository }}" --clobber
          if ($LASTEXITCODE -ne 0) { throw "bootstrap upload failed" }

      - name: Publish legacy bootstrap manifest
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference="Stop"
          $m=[ordered]@{
            protocol=1
            version="0.10.0.10"
            package_url="https://github.com/${{ github.repository }}/releases/download/v0.10.0.9.2/XiaoMeili_0.10.0.10_bootstrap_to_0.10.0.9.2.zip"
            sha256=$env:BOOT_SHA256
            package_size=[int64]$env:BOOT_SIZE
            notes=@(
              '兼容引导编号 V0.10.0.10：仅用于绕过 V0.10.0.9.1 只比较前4段版本号的旧更新器缺陷',
              '该引导包内的 XiaoMeili.exe 实际应用版本仍为 V0.10.0.9.2；安装重启后界面会显示 V0.10.0.9.2',
              '引导包只把受保护的 VERSION.txt 标记为 0.10.0.10，以通过旧原生更新器的版本一致性校验',
              'V0.10.0.9.2 已修复完整五段版本比较、更新缓存、NDM真实文件名识别、长聊资源释放、闭嘴P0硬打断和FullSafe保护'
            )
          }
          git config user.name "XiaoMeili Update Bot"
          git config user.email "actions@users.noreply.github.com"
          git pull --rebase origin main
          $m | ConvertTo-Json -Depth 5 | Set-Content latest_v010092.json -Encoding utf8
          git add latest_v010092.json
          git commit -m "Publish XiaoMeili v0.10.0.9.2 legacy bootstrap manifest"
          git push origin main
