name: Inspect XiaoMeili v0.10.0.7 source

on:
  push:
    branches: [main]
    paths:
      - "build/inspect-trigger-v01007/**"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download source
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference="Stop"
          gh release download "v0.10.0.7" --repo "${{ github.repository }}" --pattern "XiaoMeili_V0.10.0.7_SourceProject.zip" --dir "$PWD"
          Expand-Archive -LiteralPath "$PWD\XiaoMeili_V0.10.0.7_SourceProject.zip" -DestinationPath "$PWD\src" -Force
      - name: Inspect relevant source
        shell: pwsh
        run: |
          $ErrorActionPreference="Stop"
          $main = Get-ChildItem "$PWD\src" -Recurse -File -Filter main.py | Where-Object { $_.FullName -match '[\\/]app[\\/]src[\\/]main\.py } | Select-Object -First 1
          if (-not $main) { throw "main.py not found" }
          $srcRoot = Split-Path -Parent $main.FullName
          Write-Host "=== RESOURCE DIAGNOSTIC FULL ==="
          $rd=Join-Path $srcRoot "resource_diagnostic_v01005.py"
          $n=0; Get-Content $rd | ForEach-Object { $n++; Write-Host ("{0:D5}: {1}" -f $n,$_) }
          Write-Host "=== SPEECH WORKER 1-560 ==="
          $sp=Join-Path $srcRoot "speech_input.py"; $lines=Get-Content $sp
          for($i=0;$i -lt [Math]::Min(560,$lines.Count);$i++){ Write-Host ("{0:D5}: {1}" -f ($i+1),$lines[$i]) }
          Write-Host "=== MAIN SPEECH 12150-13050 ==="
          $ml=Get-Content $main.FullName
          for($i=12149;$i -lt [Math]::Min(13050,$ml.Count);$i++){ Write-Host ("{0:D5}: {1}" -f ($i+1),$ml[$i]) }
          Write-Host "=== MAIN DIAG 8680-8860 ==="
          for($i=8679;$i -lt [Math]::Min(8860,$ml.Count);$i++){ Write-Host ("{0:D5}: {1}" -f ($i+1),$ml[$i]) }
          Write-Host "=== VISION CLASSES AND CONTROLLERS ==="
          $terms=@("class ScreenGrabber","class Valorant","def _capture","grabber=","ScreenGrabber(","def tick","def _tick","def scan","def _scan","ocr","highlight","kill")
          foreach($t in $terms){
            Get-Content $main.FullName | Select-String -Pattern $t -SimpleMatch | Select-Object -First 40 | ForEach-Object {
              Write-Host ("HIT {0}:{1}" -f $_.LineNumber,$_.Line.Trim())
            }
          }
