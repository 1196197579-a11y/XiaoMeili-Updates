name: Inspect XiaoMeili source
on:
  push:
    paths:
      - "build/inspect/**"
jobs:
  inspect:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Expand seed and inspect drag interaction
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $seed = Join-Path $PWD "seed\XiaoMeili_V0_6_1_1_BootstrapFix_UpdateReady.zip"
          $stage = Join-Path $PWD "staging_inspect"
          if (Test-Path $stage) { Remove-Item $stage -Recurse -Force }
          New-Item -ItemType Directory -Path $stage | Out-Null
          Expand-Archive -LiteralPath $seed -DestinationPath $stage -Force
          $src = Join-Path $stage "XiaoMeili_V0_6_1_1_Source"
          python "build\v062\patch_v062.py" "$src" "$PWD"
          python "build\v0621\patch_v0621.py" "$src"
          python "build\v0622\patch_v0622.py" "$src"
          python "build\v070\patch_v070.py" "$src" "$PWD"
          python "build\v071\patch_v071.py" "$src" "$PWD"
          python "build\v072\patch_v072.py" "$src" "$PWD"
          python "build\v0731\patch_v0731.py" "$src" "$PWD"
          python "build\v0732\patch_v0732.py" "$src"
          python "build\v0733\patch_v0733.py" "$src"
          python "build\v074\patch_v074.py" "$src"
          python "build\v075\patch_v075.py" "$src"
          python "build\v076\patch_v076.py" "$src" "$PWD"
          python "build\v0761\patch_v0761.py" "$src" "$PWD"
          python "build\v0762\patch_v0762.py" "$src"
          python "build\v077\patch_v077.py" "$src" "$PWD"
          python "build\v0771\patch_v0771.py" "$src" "$PWD"
          python "build\v0772\patch_v0772.py" "$src"
          python "build\v0773\patch_v0773.py" "$src"
          python "build\v0774\patch_v0774.py" "$src"
          python "build\v0775\patch_v0775.py" "$src"
          python "build\v0776\patch_v0776.py" "$src"
          python "build\v0777\patch_v0777.py" "$src"
          python "build\v0778\patch_v0778.py" "$src"
          python "build\v0779\patch_v0779.py" "$src"
          python "build\v07710\patch_v07710.py" "$src"
          python "build\v07711\patch_v07711.py" "$src"
          python "build\v07712\patch_v07712.py" "$src"
          python "build\v080\patch_v080.py" "$src"
          python "build\v082\patch_v082.py" "$src"
          python "build\v083\patch_v083.py" "$src"
          python "build\v084\patch_v084.py" "$src"
          python "build\v085\patch_v085.py" "$src"
          python "build\v086\patch_v086.py" "$src"
          python "build\v087\patch_v087.py" "$src"
          python "build\v088\patch_v088.py" "$src"
          python "build\v0881\patch_v0881.py" "$src"
          python "build\v0882\patch_v0882.py" "$src"
          python "build\v0883\patch_v0883.py" "$src"
          python "build\v089\patch_v089.py" "$src"
          python "build\v0891\patch_v0891.py" "$src"
          python "build\v0892\patch_v0892.py" "$src" "$PWD"
          $main = Join-Path $src "app\src\main.py"
          $brain = Join-Path $src "app\src\brain_qwen.py"
          $voice = Join-Path $src "app\src\voice_qwen.py"
          $ml = Get-Content -LiteralPath $main
          Write-Host "=== V0776 TARGET LINES ==="
          $patterns = @("def _brain_send","generate_async(","generation_finished","class BrainService","def generate","def ask","def cancel_generation","def preview")
          foreach ($pattern in $patterns) {
            Write-Host ("--- PATTERN: " + $pattern + " ---")
            $matches = $ml | Select-String -SimpleMatch -Pattern $pattern
            foreach ($m in $matches) {
              $n = $m.LineNumber
              $a = [Math]::Max(1, $n-18)
              $b = [Math]::Min($ml.Count, $n+40)
              for ($i=$a; $i -le $b; $i++) { Write-Host ("L{0}: {1}" -f $i, $ml[$i-1]) }
            }
          }

          Write-Host "=== V080 MAIN ARCHITECTURE TARGETS ==="
          $v80patterns = @("class PetWindow","class SettingsDialog","def _open_voice","voice_dialog","video","QMediaPlayer","QVideoWidget","QMovie","opencv","cv2.VideoCapture","action","animation","state_action","play_video","brain_service.generation_finished","voice_service.preview_finished","voice_service","QAudio","sounddevice","pyaudio","microphone","whiteboard","report_template","战报模板")
          foreach ($pattern in $v80patterns) {
            Write-Host ("--- V080 MAIN PATTERN: " + $pattern + " ---")
            $matches = $ml | Select-String -SimpleMatch -Pattern $pattern
            foreach ($m in $matches) {
              $n = $m.LineNumber
              $a = [Math]::Max(1, $n-45)
              $b = [Math]::Min($ml.Count, $n+130)
              for ($i=$a; $i -le $b; $i++) { Write-Host ("A{0}: {1}" -f $i, $ml[$i-1]) }
            }
          }

          Write-Host "=== CURRENT MAIN VOICE/LOCK TARGETS ==="
          $patterns = @("voice_combo","voice_prev","voice_next","voice_fix_btn","_voice_voices_ready","_voice_preview","_voice_fix","_open_voice_picker","load_voices_async","voice_service.preview","auto_speak","speak_after","brain_generation","generation_finished","set_interaction_lock","contextMenuEvent","poll_hover_lock_button","_v0778_unlock_pending")
          foreach ($pattern in $patterns) {
            Write-Host ("--- MAIN PATTERN: " + $pattern + " ---")
            $matches = $ml | Select-String -SimpleMatch -Pattern $pattern
            foreach ($m in $matches) {
              $n = $m.LineNumber
              $a = [Math]::Max(1, $n-35)
              $b = [Math]::Min($ml.Count, $n+100)
              for ($i=$a; $i -le $b; $i++) { Write-Host ("M{0}: {1}" -f $i, $ml[$i-1]) }
            }
          }

          Write-Host "=== V085 SPEECH SESSION / WHITEBOARD TARGETS ==="
          $patterns = @("_begin_speech_session","_end_speech_session","_speech_session","_speech_session_timer","_handle_speech","_on_speech","_split_wake_phrase","DialogueBoardOverlay","whiteboard","playback_started","playback_finished","hold_ms","freeze","pause","conversation","green","status_light","wake")
          foreach ($pattern in $patterns) {
            Write-Host ("--- V085 TARGET: " + $pattern + " ---")
            $matches = $ml | Select-String -SimpleMatch -Pattern $pattern
            foreach ($m in $matches) {
              $n = $m.LineNumber
              $a = [Math]::Max(1, $n-55)
              $b = [Math]::Min($ml.Count, $n+160)
              for ($i=$a; $i -le $b; $i++) { Write-Host ("S{0}: {1}" -f $i, $ml[$i-1]) }
            }
          }

          Write-Host "=== V0892 GAME / WHITEBOARD TARGETS ==="
          $gpatterns = @("游戏识别","击杀","死亡","战报","白板","event","vision","capture","dxcam","valorant","nickname","我的游戏昵称","purchase","购买阶段","动作库")
          foreach ($pattern in $gpatterns) {
            Write-Host ("--- GAME PATTERN: " + $pattern + " ---")
            $matches = $ml | Select-String -SimpleMatch -Pattern $pattern
            foreach ($m in $matches) {
              $n = $m.LineNumber
              $a = [Math]::Max(1, $n-70)
              $b = [Math]::Min($ml.Count, $n+180)
              for ($i=$a; $i -le $b; $i++) { Write-Host ("G{0}: {1}" -f $i, $ml[$i-1]) }
            }
          }

          Write-Host "=== V0891 UPDATE / LOGGING TARGETS ==="
          $patterns = @("class Update","def _update","def update","download","package_url","latest.json","UPDATE_DIR","desktop_log","小美丽更新错误日志","update_helper","sha256","urllib","urlopen","requests","progress_changed","restart_requested","updates")
          foreach ($pattern in $patterns) {
            Write-Host ("--- UPDATE PATTERN: " + $pattern + " ---")
            $matches = $ml | Select-String -SimpleMatch -Pattern $pattern
            foreach ($m in $matches) {
              $n = $m.LineNumber
              $a = [Math]::Max(1, $n-55)
              $b = [Math]::Min($ml.Count, $n+150)
              for ($i=$a; $i -le $b; $i++) { Write-Host ("U{0}: {1}" -f $i, $ml[$i-1]) }
            }
          }

          Write-Host "=== V0891 SPEECH DIAGNOSTIC TARGETS ==="
          $speech = Join-Path $src "app\src\speech_input.py"
          $sl = Get-Content -LiteralPath $speech
          $spatterns = @("desktop_diagnostic","VAD_END_MISSING","ASR_EMPTY","WORKER_FATAL","小美丽语音故障日志")
          foreach ($pattern in $spatterns) {
            Write-Host ("--- SPEECH PATTERN: " + $pattern + " ---")
            $matches = $sl | Select-String -SimpleMatch -Pattern $pattern
            foreach ($m in $matches) {
              $n = $m.LineNumber
              $a = [Math]::Max(1, $n-45)
              $b = [Math]::Min($sl.Count, $n+120)
              for ($i=$a; $i -le $b; $i++) { Write-Host ("D{0}: {1}" -f $i, $sl[$i-1]) }
            }
          }

          Write-Host "=== V090 VISION / EVENT / BOARD TARGETS ==="
          $v90patterns = @(
            "class VisionWorker","def run(self)","def _detect","nickname_edit",
            "vision_enabled","hp_threshold","nickname_ocr_cb","STATE_NAMES",
            "kill","击杀","death","死亡","victory","获胜","win","lose",
            "DialogueBoardOverlay","def show_board","def play","whiteboard",
            "voice_service","preview_finished","playback_started","playback_finished",
            "def _v774_open_actions","def open_system_section","game",
            "report","战报","screen","capture","dxcam","mss","pyautogui"
          )
          foreach ($pattern in $v90patterns) {
            Write-Host ("--- V090 PATTERN: " + $pattern + " ---")
            $matches = $ml | Select-String -SimpleMatch -Pattern $pattern
            foreach ($m in $matches) {
              $n = $m.LineNumber
              $a = [Math]::Max(1, $n-80)
              $b = [Math]::Min($ml.Count, $n+220)
              for ($i=$a; $i -le $b; $i++) { Write-Host ("R{0}: {1}" -f $i, $ml[$i-1]) }
            }
          }

          Write-Host "=== CURRENT VOICE_QWEN TARGETS ==="
          $vl = Get-Content -LiteralPath $voice
          $vpatterns = @("PRESETS","design_bean","design_ice","load_voices_async","def preview","def synthesize","def _synthesize","voice_id","speed","instruct","generate_voice_design")
          foreach ($pattern in $vpatterns) {
            Write-Host ("--- VOICE PATTERN: " + $pattern + " ---")
            $matches = $vl | Select-String -SimpleMatch -Pattern $pattern
            foreach ($m in $matches) {
              $n = $m.LineNumber
              $a = [Math]::Max(1, $n-35)
              $b = [Math]::Min($vl.Count, $n+110)
              for ($i=$a; $i -le $b; $i++) { Write-Host ("V{0}: {1}" -f $i, $vl[$i-1]) }
            }
          }

          Write-Host "=== BRAIN_QWEN V0777 TARGETS ==="
          $bl = Get-Content -LiteralPath $brain
          $bpatterns = @("PRESETS","design_bean","display_name","load_voices_async","def preview","voices_ready")
          foreach ($pattern in $bpatterns) {
            Write-Host ("--- BRAIN PATTERN: " + $pattern + " ---")
            $matches = $bl | Select-String -SimpleMatch -Pattern $pattern
            foreach ($m in $matches) {
              $n = $m.LineNumber
              $a = [Math]::Max(1, $n-30)
              $b = [Math]::Min($bl.Count, $n+90)
              for ($i=$a; $i -le $b; $i++) { Write-Host ("B{0}: {1}" -f $i, $bl[$i-1]) }
            }
          }

      - name: Upload expanded source
        uses: actions/upload-artifact@v4
        with:
          name: expanded-source-v0892
          path: |
            staging_inspect/XiaoMeili_V0_6_1_1_Source/app/src/main.py
            staging_inspect/XiaoMeili_V0_6_1_1_Source/app/src/brain_qwen.py
            staging_inspect/XiaoMeili_V0_6_1_1_Source/app/src/voice_qwen.py
            staging_inspect/XiaoMeili_V0_6_1_1_Source/app/src/speech_input.py
            staging_inspect/XiaoMeili_V0_6_1_1_Source/app/src/ndm_bridge.py
            staging_inspect/XiaoMeili_V0_6_1_1_Source/app/assets/update_helper.ps1
          if-no-files-found: error
