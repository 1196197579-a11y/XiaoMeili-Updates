          foreach ($obsolete in @('BEAUTY LINK','"LOCK"','"INSIGHT"','"MAX"')) { if ($sidebar.Contains($obsolete)) { throw "Old simplified sidebar label returned: $obsolete" } }
          if ($sidebar -match 'QTimer\(self\)') { throw "Ability sidebar regained an idle polling timer" }
          if ($sidebar -match 'unlink\(|rmtree\(|os\.remove\(|shutil\.move\(|Remove-Item') { throw "Ability sidebar contains a destructive file operation" }
