name: Snapshot XiaoMeili v0.10.0.7 source

on:
  push:
    branches: [main]
    paths:
      - "build/inspect-trigger-v01007/**"

permissions:
  contents: write

jobs:
  inspect:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download source and snapshot selected files
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference="Stop"
          gh release download "v0.10.0.7" --repo "${{ github.repository }}" --pattern "XiaoMeili_V0.10.0.7_SourceProject.zip" --dir "$PWD"
          Expand-Archive -LiteralPath "$PWD\XiaoMeili_V0.10.0.7_SourceProject.zip" -DestinationPath "$PWD\src" -Force
          $main = Get-ChildItem "$PWD\src" -Recurse -File -Filter main.py | Where-Object { $_.Directory.Name -eq "src" -and $_.Directory.Parent.Name -eq "app" } | Select-Object -First 1
          if (-not $main) { throw "main.py not found" }
          $srcRoot=$main.Directory.FullName
          $snap=Join-Path $PWD "snapshot\v01007"
          New-Item -ItemType Directory -Force -Path $snap | Out-Null
          Copy-Item -LiteralPath $main.FullName -Destination (Join-Path $snap "main.py") -Force
          foreach($name in @("speech_input.py","resource_diagnostic_v01005.py","brain_dual.py","voice_dual.py","cloud_support.py","cloud_usage.py","native_updater.py")){
            $p=Join-Path $srcRoot $name
            if(Test-Path $p){ Copy-Item -LiteralPath $p -Destination (Join-Path $snap $name) -Force }
          }
          git config user.name "XiaoMeili Inspect Bot"
          git config user.email "actions@users.noreply.github.com"
          git add snapshot/v01007
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "Snapshot selected V0.10.0.7 source files"
            git push origin main
          } else {
            Write-Host "Snapshot already current"
          }
