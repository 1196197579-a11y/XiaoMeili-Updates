name: Publish XiaoMeili V0.11.0.3 desktop linkage and template fixes

on:
  push:
    branches: [main]
    paths:
      - "build/release-trigger-v01103/candidate.json"

permissions:
  contents: write

concurrency:
  group: xiaomeili-v01103-safe-release
  cancel-in-progress: false

jobs:
  build-test-publish:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.10"
      - name: Build, verify, publish, and promote V0.11.0.3
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File "build/v01103/release_v01103.ps1"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v01103-release-evidence
          path: |
            work-v01103/build-metadata.json
            work-v01103/public-readback.json
            work-v01103/test-output.txt
