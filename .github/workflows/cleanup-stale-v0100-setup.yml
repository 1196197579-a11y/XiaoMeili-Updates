name: Remove stale V0.10.0 setup asset

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/cleanup-stale-v0100-setup.yml"

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Remove obsolete installer asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete-asset v0.10.0 XiaoMeili_Setup_0.10.0.exe --yes --repo "${{ github.repository }}" || true
