name: Build and publish XiaoMeili v0.10.0.3

on:
  push:
    branches: [main]
    paths:
      - "build/release-trigger/**"

permissions:
  contents: write

jobs:
  build-publish:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout update repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Expand one-time bootstrap seed
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $seed = Join-Path $PWD "seed\XiaoMeili_V0_6_1_1_BootstrapFix_UpdateReady.zip"
          if (-not (Test-Path $seed)) { throw "Bootstrap seed ZIP not found: $seed" }
          $stage = Join-Path $PWD "staging"
          if (Test-Path $stage) { Remove-Item $stage -Recurse -Force }
          New-Item -ItemType Directory -Path $stage | Out-Null
          Expand-Archive -LiteralPath $seed -DestinationPath $stage -Force
          $source = Join-Path $stage "XiaoMeili_V0_6_1_1_Source"
          if (-not (Test-Path (Join-Path $source "app\src\main.py"))) {
            throw "Unexpected seed layout: $source"
          }
          "SOURCE_ROOT=$source" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Patch stable source to v0.9.2.8
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          function Run-PythonChecked {
            param([Parameter(ValueFromRemainingArguments=$true)][string[]]$Args)
            & python @Args
            if ($LASTEXITCODE -ne 0) { throw "Python command failed: python $($Args -join ' ')" }
          }
          Run-PythonChecked "build\v062\patch_v062.py" "$env:SOURCE_ROOT" "$PWD"
          Run-PythonChecked "build\v0621\patch_v0621.py" "$env:SOURCE_ROOT"
          Run-PythonChecked "build\v0622\patch_v0622.py" "$env:SOURCE_ROOT"
          Run-PythonChecked "build\v070\patch_v070.py" "$env:SOURCE_ROOT" "$PWD"
          Run-PythonChecked "build\v071\patch_v071.py" "$env:SOURCE_ROOT" "$PWD"
          Run-PythonChecked "build\v072\patch_v072.py" "$env:SOURCE_ROOT" "$PWD"
          Run-PythonChecked "build\v0731\patch_v0731.py" "$env:SOURCE_ROOT" "$PWD"
          Run-PythonChecked "build\v0732\patch_v0732.py" "$env:SOURCE_ROOT"
          Run-PythonChecked "build\v0733\patch_v0733.py" "$env:SOURCE_ROOT"
          Run-PythonChecked "build\v074\patch_v074.py" "$env:SOURCE_ROOT"
          Run-PythonChecked "build\v075\patch_v075.py" "$env:SOURCE_ROOT"
          Run-PythonChecked "build\v076\patch_v076.py" "$env:SOURCE_ROOT" "$PWD"
          Run-PythonChecked "build\v0761\patch_v0761.py" "$env:SOURCE_ROOT" "$PWD"
          Run-PythonChecked "build\v0762\patch_v0762.py" "$env:SOURCE_ROOT"
          Run-PythonChecked "build\v077\patch_v077.py" "$env:SOURCE_ROOT" "$PWD"
          Run-PythonChecked "build\v0771\patch_v0771.py" "$env:SOURCE_ROOT" "$PWD"
          Run-PythonChecked "build\v0772\patch_v0772.py" "$env:SOURCE_ROOT"
          Run-PythonChecked "build\v0773\patch_v0773.py" "$env:SOURCE_ROOT"
          Run-PythonChecked "build\v0774\patch_v0774.py" "$env:SOURCE_ROOT"
          Run-PythonChecked "build\v0775\patch_v0775.py" "$env:SOURCE_ROOT"
          Run-PythonChecked "build\v0776\patch_v0776.py" "$env:SOURCE_ROOT"
          Run-PythonChecked "build\v0777\patch_v0777.py" "$env:SOURCE_ROOT"
          Run-PythonChecked "build\v0778\patch_v0778.py" "$env:SOURCE_ROOT"
          Run-PythonChecked "build\v0779\patch_v0779.py" "$env:SOURCE_ROOT"
          Run-PythonChecked "build\v07710\patch_v07710.py" "$env:SOURCE_ROOT"
          Run-PythonChecked "build\v07711\patch_v07711.py" "$env:SOURCE_ROOT"
          Run-PythonChecked "build\v07712\patch_v07712.py" "$env:SOURCE_ROOT"
          Run-PythonChecked "build\v080\patch_v080.py" "$env:SOURCE_ROOT"
          Run-PythonChecked "build\v082\patch_v082.py" "$env:SOURCE_ROOT"
          Run-PythonChecked "build\v083\patch_v083.py" "$env:SOURCE_ROOT"
          Run-PythonChecked "build\v084\patch_v084.py" "$env:SOURCE_ROOT"
          Run-PythonChecked "build\v085\patch_v085.py" "$env:SOURCE_ROOT"
          Run-PythonChecked "build\v086\patch_v086.py" "$env:SOURCE_ROOT"
          Run-PythonChecked "build\v087\patch_v087.py" "$env:SOURCE_ROOT"
          Run-PythonChecked "build\v088\patch_v088.py" "$env:SOURCE_ROOT"
          Run-PythonChecked "build\v0881\patch_v0881.py" "$env:SOURCE_ROOT"
          Run-PythonChecked "build\v0882\patch_v0882.py" "$env:SOURCE_ROOT"
          Run-PythonChecked "build\v0883\patch_v0883.py" "$env:SOURCE_ROOT"
          Run-PythonChecked "build\v089\patch_v089.py" "$env:SOURCE_ROOT"
          Run-PythonChecked "build\v0891\patch_v0891.py" "$env:SOURCE_ROOT"
          Run-PythonChecked "build\v0892\patch_v0892.py" "$env:SOURCE_ROOT" "$PWD"
          Run-PythonChecked "build\v090\patch_v090.py" "$env:SOURCE_ROOT"
          Run-PythonChecked "build\v091\patch_v091.py" "$env:SOURCE_ROOT"
          Run-PythonChecked "build\v0911\patch_v0911.py" "$env:SOURCE_ROOT"
          Run-PythonChecked "build\v092\patch_v092.py" "$env:SOURCE_ROOT" "$PWD"
          Run-PythonChecked "build\v0921\patch_v0921.py" "$env:SOURCE_ROOT" "$PWD"
          Run-PythonChecked "build\v0922\patch_v0922_part1.py" "$env:SOURCE_ROOT"
          Run-PythonChecked "build\v0922\patch_v0922_part2.py" "$env:SOURCE_ROOT"
          Run-PythonChecked "build\v0922\patch_v0922_part3.py" "$env:SOURCE_ROOT"
          Run-PythonChecked "build\v0922\patch_v0922_part4.py" "$env:SOURCE_ROOT"
          Run-PythonChecked "build\v0923\patch_v0923.py" "$env:SOURCE_ROOT"
          Run-PythonChecked "build\v0924\patch_v0924.py" "$env:SOURCE_ROOT"
          Run-PythonChecked "build\v0925\patch_v0925.py" "$env:SOURCE_ROOT"
          Run-PythonChecked "build\v0925_fullsafe\patch_fullsafe_native.py" "$env:SOURCE_ROOT" "$PWD"
          Run-PythonChecked "build\v0926\patch_v0926.py" "$env:SOURCE_ROOT"
          Run-PythonChecked "build\v0927\patch_v0927.py" "$env:SOURCE_ROOT"
          Run-PythonChecked "build\v0927\test_v0927_contract.py" "$env:SOURCE_ROOT"
          Run-PythonChecked "build\v0928\patch_v0928.py" "$env:SOURCE_ROOT"
          Run-PythonChecked "build\v0928\test_v0928_contract.py" "$env:SOURCE_ROOT"
          Run-PythonChecked "-m" "py_compile" "$env:SOURCE_ROOT\app\src\main.py" "$env:SOURCE_ROOT\app\src\voice_qwen.py" "$env:SOURCE_ROOT\app\src\brain_qwen.py" "$env:SOURCE_ROOT\app\src\ndm_bridge.py" "$env:SOURCE_ROOT\app\src\speech_input.py"
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$env:SOURCE_ROOT\app\assets\storage_migrate.ps1", [ref]$tokens, [ref]$parseErrors) | Out-Null
          if ($parseErrors.Count -gt 0) { throw "PowerShell helper parse failed: $($parseErrors | Out-String)" }
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$env:SOURCE_ROOT\app\assets\update_helper.ps1", [ref]$tokens, [ref]$parseErrors) | Out-Null
          if ($parseErrors.Count -gt 0) { throw "Update helper parse failed: $($parseErrors | Out-String)" }
          $testSrc = "C:\Users\Public\XiaoMeiliData_CI_0761"
          $testDst = "D:\XiaoMeiliData_CI_0761"
          $testLog = "D:\xiaomeili_migration_ci_0761.log"
          $testReady = "D:\xiaomeili_migration_ci_0761.ready"
          Remove-Item -LiteralPath $testSrc -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item -LiteralPath $testDst -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item -LiteralPath $testLog -Force -ErrorAction SilentlyContinue
          Remove-Item -LiteralPath $testReady -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path (Join-Path $testSrc "brain\models") | Out-Null
          New-Item -ItemType Directory -Force -Path (Join-Path $testSrc "voice\runtime") | Out-Null
          New-Item -ItemType Directory -Force -Path (Join-Path $testSrc "assets") | Out-Null
          '{"ok":true}' | Set-Content -LiteralPath (Join-Path $testSrc "config.json") -Encoding UTF8
          'modeldata' | Set-Content -LiteralPath (Join-Path $testSrc "brain\models\test.gguf") -Encoding UTF8
          'voicedata' | Set-Content -LiteralPath (Join-Path $testSrc "voice\runtime\test.bin") -Encoding UTF8
          'assetdata' | Set-Content -LiteralPath (Join-Path $testSrc "assets\idle.txt") -Encoding UTF8
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File "$env:SOURCE_ROOT\app\assets\storage_migrate.ps1" -Source $testSrc -Target $testDst -ParentPid 999999 -ExePath "C:\Windows\System32\whoami.exe" -DesktopLog $testLog -ReadyFile $testReady
          if ($LASTEXITCODE -ne 0) {
            if (Test-Path -LiteralPath $testLog) { Get-Content -LiteralPath $testLog | Write-Host }
            throw "Windows PowerShell 5.1 migration smoke test failed: exit=$LASTEXITCODE"
          }
          if (-not (Test-Path -LiteralPath $testReady)) { throw "migration READY handshake missing" }
          $testItem = Get-Item -LiteralPath $testSrc -Force
          if (($testItem.Attributes -band [System.IO.FileAttributes]::ReparsePoint) -eq 0) { throw "migration source is not a junction" }
          if (-not (Test-Path -LiteralPath (Join-Path $testSrc "brain\models\test.gguf"))) { throw "old compatibility path cannot read migrated file" }
          if (-not (Test-Path -LiteralPath (Join-Path $testDst "brain\models\test.gguf"))) { throw "D target missing migrated file" }
          $migrationBackups = @(Get-ChildItem -LiteralPath (Split-Path -Parent $testSrc) -Directory -Force -ErrorAction SilentlyContinue | Where-Object { $_.Name -like ((Split-Path -Leaf $testSrc) + '.__C_BACKUP__.*') })
          if ($migrationBackups.Count -lt 1) { throw "V0.9.2.8 migration safety backup was not retained" }
          if (-not (Test-Path -LiteralPath (Join-Path $migrationBackups[0].FullName "brain\models\test.gguf"))) { throw "V0.9.2.8 migration safety backup is incomplete" }
          Write-Host "V0.9.2.8 migration helper non-destructive smoke test PASS"
          $main = Get-Content -LiteralPath "$env:SOURCE_ROOT\app\src\main.py" -Raw
          if ($main -notmatch 'APP_VERSION\s*=\s*"0\.9\.2\.8"') { throw "Source version verification failed: expected 0.9.2.8" }
          if ($main -notmatch 'def ensure_desktop_launcher\(\):') { throw "V0.9.2.8 stable desktop launcher helper missing" }
          if ($main -notmatch 'target = desktop_dir\(\) / "小美丽\.exe"') { throw "V0.9.2.8 desktop XiaoMeili.exe target missing" }
          if ($main -notmatch 'target\.open\("xb"\)') { throw "V0.9.2.8 create-new-only desktop launcher policy missing" }
          if ($main -match 'QAbstractItemView\.SelectionMode\.SingleSelection') { throw "V0.9.2.8 QAbstractItemView crash path remains" }
          if ($main -notmatch 'def _v0927_save_highlight_ui_now\(self\):') { throw "V0.9.2.8 high-glow immediate save helper missing" }
          if ($main -notmatch 'self\._v0927_highlight_save_timer') { throw "V0.9.2.8 high-glow debounce save timer missing" }
          if ($main -notmatch 'cfg\[k\] = v') { throw "V0.9.2.8 forward-compatible config carry-through missing" }
          if ($main -notmatch 'def _v0926_choose_and_test_asset\(self,state\):') { throw "V0.9.2.8 exact asset chooser missing" }
          if ($main -notmatch 'def _v0926_highlight_text_box_for\(self,path\):') { throw "V0.9.2.8 per-video highlight layout helper missing" }
          if ($main -notmatch 'video_text_boxes') { throw "V0.9.2.8 per-video highlight layout store missing" }
          if ($main -match 'top\.addWidget\(info\); top\.addWidget\(HelpBadge\("每条素材显示首帧缩略图') { throw "V0.9.2.8 unused asset-manager help badge remains" }
          if ($main -notmatch 'setter\("\?"\)') { throw "V0.9.2.8 true question-mark help UI missing" }
          if ($main -notmatch 'from native_updater import install_update_package') { throw "V0.9.2.8 native updater import missing" }
          if ($main -notmatch 'def _v088_selected_exchange\(self\):') { throw "V0.8.8 feature verification failed: direct correction helper missing" }
          if ($main -notmatch 'warm_up_async') { throw "V0.8.8 feature verification failed: warmup missing" }
          $brain = Get-Content -LiteralPath "$env:SOURCE_ROOT\app\src\brain_qwen.py" -Raw
          if ($brain -notmatch 'def _fast_rule_candidates\(self, user_text, limit=6\):') { throw "V0.8.8 feature verification failed: fast rule retrieval missing" }
          if ($brain -notmatch '\[BRAIN_LATENCY\]') { throw "V0.8.8 feature verification failed: latency diagnostics missing" }
          if ($main -notmatch 'self\.v774_nav_names = \["常规", "常用", "大脑", "声音", "互动", "动作", "系统"\]') { throw "V0.9.2.8 favorites navigation missing" }
          if ($main -notmatch 'def _v0882_manage_favorites\(self\):') { throw "V0.9.2.8 favorites manager missing" }
          if ($main -match '"状态动作"[\s\S]{0,500}self\._v774_open_actions') { throw "V0.9.2.8 duplicate 状态动作 action entrance remains" }
          if ($main -match '"视频素材"[\s\S]{0,500}self\._v774_open_actions') { throw "V0.9.2.8 duplicate 视频素材 action entrance remains" }
          $brain = Get-Content -LiteralPath "$env:SOURCE_ROOT\app\src\brain_qwen.py" -Raw
          if ($brain -notmatch '这是行为策略，不是台词模板') { throw "V0.9.2.8 behavior-rule prompt missing" }
          $speech = Get-Content -LiteralPath "$env:SOURCE_ROOT\app\src\speech_input.py" -Raw
          if ($speech -notmatch '小美丽 V0\.9\.2\.8 语音诊断日志') { throw "V0.9.2.8 speech diagnostic label missing" }
          if ($main -notmatch 'class FavoriteStarButton\(QPushButton\):') { throw "V0.9.2.8 vector favorite star class missing" }
          if ($main -notmatch '"语音对话": \("voice\.dialogue", "声音"\)') { throw "V0.9.2.8 voice dialogue favorite mapping missing" }
          if ($main -notmatch '"唤醒回应": \("voice\.wake_replies", "声音"\)') { throw "V0.9.2.8 wake reply favorite mapping missing" }
          if ($main -notmatch '"单句语气微调": \("voice\.phrase_style", "声音"\)') { throw "V0.9.2.8 phrase style favorite mapping missing" }
          if ($main -notmatch 'def _v0883_open_rule_editor\(') { throw "V0.9.2.8 unified rule editor missing" }
          if ($brain -notmatch 'feedback_aliases') { throw "V0.9.2.8 rule trigger alias protection missing" }
          if ($main -notmatch 'QPushButton\("模仿"\)') { throw "V0.9.2.8 mimic mode switch missing" }
          if ($main -notmatch 'QPushButton\("固定"\)') { throw "V0.9.2.8 fixed mode switch missing" }
          if ($main -notmatch '⚡ 0 次模型思考') { throw "V0.9.2.8 zero-inference fixed pool UI missing" }
          if ($main -notmatch 'fav_scroll\.viewport\(\)\.setStyleSheet\("background:transparent;"\)') { throw "V0.9.2.8 favorites dark-background fix missing" }
          if ($brain -notmatch 'def _v089_trigger_normalize\(text\):') { throw "V0.9.2.8 trigger-only matcher missing" }
          if ($brain -notmatch 'def _v089_fixed_reply\(self, rule\):') { throw "V0.9.2.8 fixed reply pool runtime missing" }
          if ($brain -notmatch '唯一可能相关的模仿规则') { throw "V0.9.2.8 single-rule mimic prompt missing" }
          if ($brain -notmatch '防复读重写1次') { throw "V0.9.2.8 anti-repeat retry missing" }
          if ($main -notmatch 'def _v0891_favorites_file\(self\):') { throw "V0.9.2.8 durable Favorites file helper missing" }
          if ($main -notmatch 'favorites_v2\.json') { throw "V0.9.2.8 dedicated Favorites state file missing" }
          if ($main -notmatch 'if self\.v774_nav_names\[index\] == "常用"') { throw "V0.9.2.8 Favorites page-enter refresh missing" }
          if ($main -notmatch 'ndm_download_and_import') { throw "V0.9.2.8 NDM update integration missing" }
          if ($main -notmatch 'UPDATE_LOG_DIR = LOG_DIR / "update"') { throw "V0.9.2.8 internal update log routing missing" }
          if ($main -match '小美丽更新错误日志_请上传给ChatGPT') { throw "V0.9.2.8 still contains automatic desktop updater log" }
          if ($main -match 'desktop_dir\(\) / "小美丽错误日志_请上传给ChatGPT\.txt"') { throw "V0.9.2.8 still contains automatic desktop app error log" }
          if ($speech -notmatch 'RECOVERABLE_SPEECH_EVENT') { throw "V0.9.2.8 recoverable speech event routing missing" }
          if ($speech -notmatch 'diagnostics.*speech') { throw "V0.9.2.8 internal speech diagnostics missing" }
          $helperText = Get-Content -LiteralPath "$env:SOURCE_ROOT\app\assets\update_helper.ps1" -Raw
          if ($helperText -notmatch '\[string\]\$LogPath') { throw "V0.9.2.8 update helper internal LogPath missing" }
          if ($helperText -notmatch '\[string\]\$DiagnosticDir') { throw "V0.9.2.8 update helper DiagnosticDir missing" }
          if ($helperText -match '\$DesktopLog') { throw "V0.9.2.8 update helper still writes DesktopLog" }
          if ($main -notmatch 'def _scan_enemy_alive_v090\(') { throw "V0.9.2.8 enemy alive tracker missing" }
          if ($main -notmatch 'def _ocr_own_kill_rows_v090\(') { throw "V0.9.2.8 nickname own-kill verifier missing" }
          if ($main -notmatch 'self\.highlight_event_id') { throw "V0.9.2.8 highlight event state missing" }
          if ($main -notmatch '高光回合 · P100 最高优先级') { throw "V0.9.2.8 highlight settings UI missing" }
          if ($main -notmatch 'tag="highlight_cta"') { throw "V0.9.2.8 highlight TTS trigger missing" }
          if ($main -notmatch 'def _v091_apply_settings_scale\(self, persist=False\):') { throw "V0.9.2.8 settings scale engine missing" }
          if ($main -notmatch 'settingsMainScroll') { throw "V0.9.2.8 settings scroll safety missing" }
          if ($main -notmatch '高光资格：已触发') { throw "V0.9.2.8 highlight qualification status missing" }
          if ($main -notmatch 'shuffle-bag pick') { throw "V0.9.2.8 highlight shuffle bag missing" }
          if ($main -notmatch 'class HighlightVideoOverlay\(QWidget\):') { throw "V0.9.2.8 highlight video overlay missing" }
          if ($main -notmatch '导入白板视频') { throw "V0.9.2.8 highlight video import UI missing" }
          if ($main -notmatch 'def _v0911_mute_copy_video\(') { throw "V0.9.2.8 mute import missing" }
          if ($main -notmatch '文字与限制框') { throw "V0.9.2.8 highlight text-box editor missing" }
          if ($main -notmatch 'board=str\(text or ""\)\.strip\(\)') { throw "V0.9.2.8 board/voice phrase sync missing" }
          if ($main -notmatch 'reportSnapshotBar') { throw "V0.9.2.8 report snapshot status bar missing" }
          $helperText = Get-Content -LiteralPath "$env:SOURCE_ROOT\app\assets\update_helper.ps1" -Raw
          if ($helperText -notmatch 'XIAOMEILI_INSTALL_ROOT_MARKER') { throw "V0.9.2.8 safe install marker validation missing" }
          if ($helperText -notmatch 'PROTECTED_USER_PATHS') { throw "V0.9.2.8 protected-path validation missing" }
          if ($helperText -match '(?i)/MIR|/PURGE|robocopy\.exe|Remove-Item') { throw "V0.9.2.8 updater contains forbidden destructive operation" }
          Set-Content -LiteralPath "$env:SOURCE_ROOT\app\assets\VERSION.txt" -Value "0.9.2.8" -Encoding ascii
          if ($main -notmatch 'def normalized_highlight_text_layout\(') { throw "V0.9.2.8 highlight shared typography layout missing" }
          if ($main -notmatch 'def _v0922_export_source_project\(self\):') { throw "V0.9.2.8 source project export UI missing" }
          if ($main -notmatch 'self\.pet\.hide\(\)') { throw "V0.9.2.8 highlight base-pet isolation missing" }
          if ($main -notmatch 'remove only from the configured pool') { throw "V0.9.2.8 non-destructive highlight remove policy missing" }
          $migrationText = Get-Content -LiteralPath "$env:SOURCE_ROOT\app\assets\storage_migrate.ps1" -Raw
          if ($migrationText -match 'Removing the old C: copy') { throw "V0.9.2.8 migration still deletes the original C copy" }
          if ($migrationText -notmatch 'Safety backup retained at') { throw "V0.9.2.8 migration backup-retention policy missing" }
          if ($main -notmatch 'hashlib, uuid') { throw "V0.9.2.8 uuid import missing" }
          if ($main -notmatch 'QFrame, QScrollArea, QSizePolicy') { throw "V0.9.2.8 QSizePolicy import missing" }
          if ($main -match '只有校验通过才删除 C 盘旧副本') { throw "V0.9.2.8 migration UI still promises destructive cleanup" }
          if ($main -notmatch '程序不会自动删除它') { throw "V0.9.2.8 migration UI safety wording missing" }
          if ($helperText -match 'GetRelativePath') { throw "V0.9.2.8 updater still depends on PowerShell/.NET GetRelativePath" }
          if ($helperText -notmatch 'Substring\(\$actualRoot\.Length\)') { throw "V0.9.2.8 PowerShell 5.1 relative-path fallback missing" }
          if ($main -notmatch '自动存储清理已禁用：V0\.9\.2\.8') { throw "V0.9.2.8 no-auto-delete cleanup guard missing" }
          if ($main -match 'def cleanup_obsolete_storage\(\):[\s\S]{0,1800}(unlink|rmtree)') { throw "V0.9.2.8 cleanup still contains deletion calls" }
          if ($main -notmatch 'self\.highlight_preview_btn=QPushButton\("预览"\)') { throw "V0.9.2.8 single Preview button missing" }
          if ($main -notmatch 'def _v0924_preview_highlight\(self\):') { throw "V0.9.2.8 unified preview handler missing" }
          if ($main -notmatch 'def _v0924_preview_pick_phrase\(self\):') { throw "V0.9.2.8 randomized phrase picker missing" }
          if ($main -notmatch 'tag="highlight_preview"') { throw "V0.9.2.8 synced highlight preview tag missing" }
          if ($main -notmatch 'def _v0925_highlight_preview_started\(self, text, duration_ms, tag\):') { throw "V0.9.2.8 playback-start sync handler missing" }
          if ($main -notmatch 'def _v0925_highlight_preview_finished\(self, ok, message, tag\):') { throw "V0.9.2.8 3-second preview tail handler missing" }
          if ($main -notmatch 'hold_ms=3000') { throw "V0.9.2.8 high-glow 3-second hold missing" }
          if ($main -notmatch 'QCheckBox::indicator:checked') { throw "V0.9.2.8 global green toggle selector missing" }
          if ($main -notmatch 'image: url\("\{toggle_on\}"\)') { throw "V0.9.2.8 green toggle checked image missing" }
          if ($main -notmatch 'assets/v0925/toggle_on\.svg') { throw "V0.9.2.8 green toggle asset path missing" }
          if ($main -match 'hf\.addRow\("触发条件",conditions\)') { throw "V0.9.2.8 visible trigger-condition row remains" }
          foreach ($obsolete in @('QPushButton\("预览选中"\)','QPushButton\("▶ 随机预览高光"\)','QPushButton\("逐句试听下一句"\)','QPushButton\("仅预览白板"\)','hf\.addRow\("仅预览白板文字"')) {
            if ($main -match $obsolete) { throw "V0.9.2.8 obsolete preview UI remains: $obsolete" }
          }

      - name: Apply V0.10.0 ability sidebar and safety patch
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $patchPath = Join-Path $PWD "build\v0100\v0100.patch"
          if (-not (Test-Path -LiteralPath $patchPath)) { throw "V0.10.0 patch missing: $patchPath" }
          Push-Location $env:SOURCE_ROOT
          try {
            & git apply --ignore-space-change --ignore-whitespace --whitespace=nowarn $patchPath
            if ($LASTEXITCODE -ne 0) { throw "V0.10.0 patch application failed: $LASTEXITCODE" }
          } finally {
            Pop-Location
          }
          python "$env:SOURCE_ROOT\tests\test_v0100_contract.py"
          if ($LASTEXITCODE -ne 0) { throw "V0.10.0 contract failed: $LASTEXITCODE" }
          python -m py_compile "$env:SOURCE_ROOT\app\src\main.py" "$env:SOURCE_ROOT\app\src\ability_sidebar.py" "$env:SOURCE_ROOT\app\src\voice_qwen.py" "$env:SOURCE_ROOT\app\src\brain_qwen.py" "$env:SOURCE_ROOT\app\src\ndm_bridge.py" "$env:SOURCE_ROOT\app\src\speech_input.py"
          if ($LASTEXITCODE -ne 0) { throw "V0.10.0 syntax compile failed: $LASTEXITCODE" }
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$env:SOURCE_ROOT\app\assets\storage_migrate.ps1", [ref]$tokens, [ref]$parseErrors) | Out-Null
          if ($parseErrors.Count -gt 0) { throw "V0.10.0 storage helper parse failed: $($parseErrors | Out-String)" }
          $main = Get-Content -LiteralPath "$env:SOURCE_ROOT\app\src\main.py" -Raw
          if ($main -notmatch 'APP_VERSION\s*=\s*"0\.10\.0"') { throw "V0.10.0 version gate failed" }
          if ($main -match 'QTimer\.singleShot\(9000, lambda: self\.brain_service\.cleanup_ndm_leftovers') { throw "V0.10.0 forbidden NDM auto-cleanup returned" }
          $ndm = Get-Content -LiteralPath "$env:SOURCE_ROOT\app\src\ndm_bridge.py" -Raw
          if ($ndm -match 'root\.rglob\(' -or $ndm -match 'shutil\.move\(') { throw "V0.10.0 unsafe NDM fallback returned" }
