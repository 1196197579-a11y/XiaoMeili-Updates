      - name: Non-destructive updater safety gate
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $main = Get-Content -LiteralPath "$env:SOURCE_ROOT\app\src\main.py" -Raw
          $helperPath = "$env:SOURCE_ROOT\app\assets\update_helper.ps1"
          $helper = Get-Content -LiteralPath $helperPath -Raw

          foreach ($bad in @('/MIR','/PURGE','Remove-Item','robocopy.exe','Stop-Process')) {
            if ($helper -match [regex]::Escape($bad)) {
              throw "SAFETY BLOCK: update helper contains destructive token: $bad"
            }
          }
          if ($main -match 'target\s*=\s*Path\(sys\.executable\)\.parent') {
            throw "SAFETY BLOCK: updater still derives target from sys.executable.parent."
          }
          if ($main -notmatch 'latest_safe\.json') {
            throw "SAFETY BLOCK: new build is not isolated on latest_safe.json."
          }
          if ($helper -notmatch 'XIAOMEILI_INSTALL_ROOT_MARKER') {
            throw "SAFETY BLOCK: install-root marker validation missing."
          }
          if ($helper -notmatch 'PROTECTED_USER_PATHS') {
            throw "SAFETY BLOCK: protected-path denylist missing."
          }
          if ($helper -notmatch 'LOCALAPPDATA' -or $helper -notmatch 'XiaoMeiliApp') {
            throw "SAFETY BLOCK: fixed managed root missing."
          }

          $desktop = [Environment]::GetFolderPath('Desktop')
          $sentinel = Join-Path $desktop "XiaoMeili_CI_DO_NOT_DELETE.txt"
          "sentinel" | Set-Content -LiteralPath $sentinel -Encoding UTF8
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File $helperPath -Package "C:\does-not-exist.zip" -InstallRoot $desktop -ExpectedVersion "9.9.9" -ExpectedSha256 "deadbeef" -ParentPid 999999 -LogPath "$env:RUNNER_TEMP\unsafe.log" -DiagnosticDir "$env:RUNNER_TEMP\diag"
          if ($LASTEXITCODE -eq 0) { throw "SAFETY BLOCK: helper accepted Desktop as install root." }
          if (-not (Test-Path -LiteralPath $sentinel)) { throw "SAFETY BLOCK: Desktop sentinel was deleted." }
          Write-Host "Non-destructive updater safety gate PASS."
          exit 0

      - name: Positive safe-updater helper smoke test
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $env:LOCALAPPDATA = Join-Path $env:RUNNER_TEMP "xm-safe-localappdata"
          $root = Join-Path $env:LOCALAPPDATA "XiaoMeiliApp"
          $versions = Join-Path $root "versions"
          New-Item -ItemType Directory -Force -Path $versions | Out-Null
          @{
            schema = 2
            product = "XiaoMeili"
            install_id = "ci-safe-helper"
            root_policy = "LOCALAPPDATA_XiaoMeiliApp_ONLY"
            deletion_policy = "NO_AUTOMATIC_FILE_DELETION"
          } | ConvertTo-Json | Set-Content -LiteralPath (Join-Path $root ".xiaomeili-install.json") -Encoding UTF8
          Copy-Item -LiteralPath "$env:WINDIR\System32\whoami.exe" -Destination (Join-Path $root "XiaoMeiliLauncher.exe") -Force

          $payload = Join-Path $env:RUNNER_TEMP "xm-safe-payload"
          New-Item -ItemType Directory -Force -Path (Join-Path $payload "_internal\assets") | Out-Null
          Copy-Item -LiteralPath "$env:WINDIR\System32\whoami.exe" -Destination (Join-Path $payload "XiaoMeili.exe") -Force
          "0.10.0.3" | Set-Content -LiteralPath (Join-Path $payload "_internal\assets\VERSION.txt") -Encoding ASCII
          $package = Join-Path $env:RUNNER_TEMP "xm-safe-update.zip"
          Compress-Archive -Path (Join-Path $payload "*") -DestinationPath $package -CompressionLevel NoCompression
          $sha = (Get-FileHash -LiteralPath $package -Algorithm SHA256).Hash.ToLowerInvariant()
          $log = Join-Path $env:RUNNER_TEMP "positive-updater.log"
          $diag = Join-Path $env:RUNNER_TEMP "positive-updater-diag"
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File "$env:SOURCE_ROOT\app\assets\update_helper.ps1" -Package $package -InstallRoot $root -ExpectedVersion "0.10.0.3" -ExpectedSha256 $sha -ParentPid 999999 -LogPath $log -DiagnosticDir $diag
          if ($LASTEXITCODE -ne 0) {
            if (Test-Path -LiteralPath $log) { Get-Content -LiteralPath $log | Write-Host }
            if (Test-Path -LiteralPath $diag) { Get-ChildItem -LiteralPath $diag | ForEach-Object { Get-Content -LiteralPath $_.FullName | Write-Host } }
            throw "Positive safe updater smoke test failed: exit=$LASTEXITCODE"
          }
          $active = Get-Content -LiteralPath (Join-Path $root "active.json") -Raw | ConvertFrom-Json
          if ([string]$active.version -ne "0.10.0.3") { throw "Positive updater did not activate expected version" }
          Write-Host "Positive safe-updater helper smoke test PASS"

      - name: Native no-delete updater integration test
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python "build\v0925_fullsafe\test_native_updater.py" "$env:SOURCE_ROOT"
          if ($LASTEXITCODE -ne 0) { throw "Native updater integration test failed: $LASTEXITCODE" }
          $main = Get-Content -LiteralPath "$env:SOURCE_ROOT\app\src\main.py" -Raw
          $native = Get-Content -LiteralPath "$env:SOURCE_ROOT\app\src\native_updater.py" -Raw
          if ($main -notmatch 'from native_updater import install_update_package') { throw "Native updater import missing" }
          if ($main -notmatch 'install_update_package\(') { throw "Native updater call missing" }
          if ($native -notmatch 'native-no-delete-v1') { throw "Native updater safety marker missing" }
          Write-Host "Native no-delete updater integration test PASS"

      - name: Create embedded V0.10.0.3 complete source project
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $sourceProject = Join-Path $env:RUNNER_TEMP "XiaoMeili_V0.10.0.3_SourceProject"
          if (Test-Path -LiteralPath $sourceProject) { Remove-Item -LiteralPath $sourceProject -Recurse -Force }
          New-Item -ItemType Directory -Path $sourceProject -Force | Out-Null
          Copy-Item -Path (Join-Path $env:SOURCE_ROOT "*") -Destination $sourceProject -Recurse -Force
          $pipelineDir = Join-Path $sourceProject "release_pipeline"
          New-Item -ItemType Directory -Path $pipelineDir -Force | Out-Null
          Copy-Item -LiteralPath (Join-Path $PWD "build") -Destination (Join-Path $pipelineDir "build") -Recurse -Force
          Copy-Item -LiteralPath (Join-Path $PWD ".github\workflows\build-v062.yml") -Destination (Join-Path $pipelineDir "build-v01003.yml") -Force
          @(
            "XiaoMeili V0.10.0.3 complete editable source project",
            "Generated from the verified release pipeline at commit $env:GITHUB_SHA.",
            "Contains final application source/assets plus the release patch pipeline.",
            "Excludes user data, downloaded model weights, personal memories/logs and user-imported media."
          ) | Set-Content -LiteralPath (Join-Path $sourceProject "SOURCE_PROVENANCE.txt") -Encoding UTF8
          @(
            "# XiaoMeili V0.10.0.3 development",
            "Windows 10/11 x64 + Python 3.12 x64",
            "Run: python app\src\main.py",
            "The complete release pipeline is in release_pipeline."
          ) | Set-Content -LiteralPath (Join-Path $sourceProject "DEVELOPMENT.md") -Encoding UTF8
          @(
            "@echo off",
            "cd /d ""%~dp0""",
            "if exist "".venv\Scripts\python.exe"" (" ,
            "  "".venv\Scripts\python.exe"" app\src\main.py",
            ") else (",
            "  py -3.12 app\src\main.py",
            ")"
          ) | Set-Content -LiteralPath (Join-Path $sourceProject "RUN_DEV.cmd") -Encoding ASCII
          $sourceBundle = "$env:SOURCE_ROOT\app\assets\XiaoMeili_V0.10.0.3_SourceProject.zip"
          if (Test-Path -LiteralPath $sourceBundle) { Remove-Item -LiteralPath $sourceBundle -Force }
          Compress-Archive -Path $sourceProject -DestinationPath $sourceBundle -CompressionLevel Optimal
          if (-not (Test-Path -LiteralPath $sourceBundle)) { throw "V0.10.0.3 embedded source bundle missing" }
          $sourceHash = (Get-FileHash -LiteralPath $sourceBundle -Algorithm SHA256).Hash.ToLowerInvariant()
          "SOURCE_BUNDLE=$sourceBundle" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "SOURCE_SHA256=$sourceHash" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install desktop build dependencies
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check --upgrade pip
          python -m pip install --disable-pip-version-check -r "$env:SOURCE_ROOT\app\requirements.txt"
          python -m pip install --disable-pip-version-check "pyinstaller>=6.10,<7" "dxcam>=0.0.5" "psutil>=6.0,<8"

      - name: Build Windows EXE
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $dist = Join-Path $PWD "out"
          $work = Join-Path $PWD "pyi-work"
          $spec = Join-Path $PWD "pyi-spec"
          $pyi = @(
            "--noconfirm", "--clean", "--windowed",
            "--name", "XiaoMeili",
            "--icon", "$env:SOURCE_ROOT\app\assets\xiaomeili_icon.ico",
            "--distpath", "$dist",
            "--workpath", "$work",
            "--specpath", "$spec",
            "--collect-all", "rapidocr",
            "--collect-all", "onnxruntime",
            "--collect-all", "soundfile",
            "--collect-all", "sounddevice",
            "--collect-all", "dxcam",
            "--add-data", "$env:SOURCE_ROOT\app\assets;assets",
            "$env:SOURCE_ROOT\app\src\main.py"
          )
          python -m PyInstaller @pyi
          if ($LASTEXITCODE -ne 0) { throw "PyInstaller failed: $LASTEXITCODE" }
          $exe = Join-Path $dist "XiaoMeili\XiaoMeili.exe"
          if (-not (Test-Path $exe)) { throw "PyInstaller did not produce XiaoMeili.exe" }
          & $exe --runtime-self-test
          if ($LASTEXITCODE -ne 0) { throw "Frozen runtime self-test failed: $LASTEXITCODE" }
          & $exe --settings-ui-self-test
          if ($LASTEXITCODE -ne 0) { throw "Frozen settings UI self-test failed: $LASTEXITCODE" }

      - name: Build stable safe launcher
        shell: pwsh
        run: |
